[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cap-evolve-core"
version = "0.1.0"
description = "Tiny stdlib-only honest-evaluation substrate for the cap-evolve skills library."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Zero hard runtime dependencies — pure stdlib by design.
dependencies = []

[project.optional-dependencies]
judge = []        # llm-judge evaluator extras (filled when that evaluator lands)
dashboard = []    # static-HTML / Flask dashboard extras
# openpyxl/pandas are the spreadsheetbench adapter's workbook stack. They are TEST deps, not
# runtime deps of cap-evolve itself — but without them every test that builds or reads a real
# .xlsx `importorskip`s, which silently skipped the whole of PR #289's
# test_spreadsheetbench_failure_localization.py in CI as well as locally.
dev = ["pytest>=7", "openpyxl>=3.1", "pandas>=2.0"]

[project.scripts]
cap-evolve = "cap_evolve.cli:main"

[project.urls]
Homepage      = "https://skillberry-ai.github.io/cap-evolve/"
Documentation = "https://skillberry-ai.github.io/cap-evolve/"
Repository    = "https://github.com/skillberry-ai/cap-evolve"
Issues        = "https://github.com/skillberry-ai/cap-evolve/issues"

[tool.setuptools]
packages = ["cap_evolve"]

# The keyless demo session replayed by `cap-evolve replay --demo` ships with the
# package (synthetic numbers — see cap_evolve.tui.DEMO_BANNER). Data files only, so
# the zero-dependency promise above is untouched.
[tool.setuptools.package-data]
cap_evolve = ["demo_session/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A `seam_contract` test runs against an EXTERNALLY INSTALLED dependency (a benchmark, a
# service) rather than against this repo, and answers a different question from every other
# test here:
#
#     a unit test failing      -> OUR code is wrong
#     a seam contract failing  -> the DEPENDENCY moved
#
# Conflating the two makes that signal unreadable, so the marker keeps them apart. Excluded by
# default because the dependency is not installed in a plain checkout; a caller that wants them
# selects the marker explicitly (its own `-m` overrides this one), which is what CI does right
# after installing the dependency and before any paid work.
#
# Deliberately NOT named after any one benchmark: core is benchmark-agnostic, and every adapter
# that tailors an external dependency needs exactly this marker.
markers = [
  "seam_contract: asserts seams in an externally installed dependency (needs it installed)",
]
addopts = "-m 'not seam_contract'"
