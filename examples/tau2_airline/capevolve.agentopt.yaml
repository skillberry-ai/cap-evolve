# AGENT-OPTIMIZE spec — tau2-bench airline, driven by skills/algorithms/agent-optimize.
#
# Differences from capevolve.yaml (which is a deterministic hill-climb, no-holdout fit):
#   * orchestration_mode: agent  → `cap-evolve run` does check + baseline, prints a
#     handoff with the run_dir, and RETURNS. The conversational agent then drives the
#     loop from SKILL.md (subset screen → full-val paired gate → commit → measure).
#   * a REAL HOLDOUT split (agentopt_split.json): train/val/test are disjoint, so the
#     sealed test number is generalisation and not a fit metric. Ids are assigned by
#     index stride (val = 0,4,8…; test = 1,5,9…; train = the rest) so the three splits
#     draw uniformly from the task list — the cheapest available defence against the
#     split-difficulty mismatch a previous run hit (val 0.75, test 0.25 on 12+8 ids).
#   * agent + user simulator run on aws/claude-haiku-4-5 through the ETE gateway
#     (TAU2_AGENT_MODEL / TAU2_USER_MODEL, normalized by adapters/gateway.py to
#     openai/aws/... so litellm takes the gateway's OpenAI-compatible route). The key
#     must be scoped for this model, not only for gpt-oss.
#
# Do NOT repoint capevolve.yaml / capevolve.itest.yaml / capevolve.smoke.yaml at this —
# CI asserts on their contents.

capabilities: [system-prompt, tools]     # optimize the airline POLICY and the TOOLS jointly
capability_path: seed_capability
actions: [edit]
capability_sources: [seed_capability/reference/data_model.py]

# --- who drives ------------------------------------------------------------
orchestration_mode: agent                # the conversational agent owns the search
algorithm_skill: agent-optimize          # algorithms/agent-optimize (agent-mode only)

# The optimizer in agent mode is the agent itself (and the subagents it fans out), so
# these are informational: no per-iteration optimizer subprocess is spawned. They are
# kept so `cap-evolve run --plan-only` and the estimator still describe the run.
optimizer_skill: claude-code
optimizer_model: claude-sonnet-4-6
optimizer_max_turns: 120
optimizer_usd_per_iter: 6.0

target_model: aws/claude-haiku-4-5       # the agent+user-sim under optimization

# --- data + splits ---------------------------------------------------------
dataset_source: adapter
split_seed: 0
split_train: 0.52
split_val: 0.24
split_test: 0.24
split_ids_file: agentopt_split.json      # train 26 / val 12 / test 12, DISJOINT

# --- scoring ---------------------------------------------------------------
# 1 trial: the PAIRED gate gets its SE from the cross-task variance of the per-task
# deltas, which is real at n_trials=1 — so the significance test is honest without
# paying 10x. pass^k is undefined here and the report says so.
num_trials: 1

# --- acceptance gate -------------------------------------------------------
gate_mode: paired
gate_k_se: 0.2

# --- budget ----------------------------------------------------------------
max_iterations: 6
stall: 3
max_metric_calls: 0
max_usd: 55.0
max_optimizer_usd: 40.0

# --- the free-text stop condition the agent re-reads every round -----------
# scripts/spend.py parses this into checkable predicates (target_val_score, max_usd,
# max_wallclock_seconds, max_stall) and re-checks them against the run dir's persisted
# spend; the prose is kept verbatim alongside.
# The seed already scores 0.833 on this val split (10/12), so the score goal is set
# above it: the run has to fix at least one of the two failing tasks to be done.
stop_condition: "reach val mean >= 0.95, or stop after $40 or 120 minutes or 3 rejects in a row; don't regress task 0"

store: copy
