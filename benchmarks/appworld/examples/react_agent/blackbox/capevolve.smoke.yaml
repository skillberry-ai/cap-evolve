# Smoke spec for the AppWorld blackbox approach (README: Running): one train task, one trial, one
# iteration -- the budget shape of ../capevolve.itest.yaml.
# scripts/setup_project.sh renders @OPT_MODEL@, @INSTRUCTIONS@ and @AW_EVAL@ and copies this into the project.
# Search settings match ../capevolve.yaml, so the two approaches are comparable.

# --- how the capability reaches the agent -----------------------------------
intervention: blackbox                   # the Skillberry Store holds it, the Proxy-Agent injects it
skill_name: my_skill

# --- what to optimize -------------------------------------------------------
capabilities: [system-prompt]            # SKILL.md = the ReAct policy + few-shot demo, injected as the system prompt
capability_path: seed_capability/my_skill
actions: [edit]
capability_sources: [reference/api_index.md, reference/react_agent_notes.md]
runner_repo_path: @AW_EVAL@/reference

# --- who proposes edits -----------------------------------------------------
optimizer_skill: claude-code
optimizer_model: @OPT_MODEL@
optimizer_max_turns: 40
optimizer_usd_per_iter: 3.0
optimizer_instructions_file: @INSTRUCTIONS@
target_model: openai/gpt-oss-120b-a100

# --- how to iterate ---------------------------------------------------------
algorithm_skill: hill-climb
algorithm_focus: all
orchestration_mode: deterministic
memory_skill: md-files

# --- data + splits ----------------------------------------------------------
dataset_source: adapter
split_seed: 0
split_ids_file: smoke_split.json

# --- scoring ----------------------------------------------------------------
num_trials: 1

# --- acceptance gate --------------------------------------------------------
gate_mode: paired
gate_k_se: 1.0

# --- budget -----------------------------------------------------------------
max_iterations: 1
stall: 0
max_metric_calls: 0
max_usd: 12.0
max_optimizer_usd: 8.0

# --- iteration store --------------------------------------------------------
protected_paths: [default]
store: git
