# cap-evolve run spec — vanilla tau2-bench airline, blackbox arm: budget run.
# Generated by following ../PROMPT.md; `cap-evolve run --spec` reads it.

# --- delivery arm --------------------------------------------------------------
intervention: blackbox                   # Skillberry proxy delivery (skills/interventions/llm-proxies/blackbox)
skill_name: my_skill                     # the ONE skill the proxy serves; preflight needs it

# --- what to optimize ----------------------------------------------------------
capabilities: [tools]                    # the agent's tool surface only (not the policy)
capability_path: seed_capability         # the seed dir (a copy is optimized)
actions: [edit]
capability_sources: [seed_capability/reference/data_model.py] # tau2's data model, copied to ./guidance/sources/
protected_paths: ["primitive_tools/*", "my_skill/SKILL.md", "reference/*"] # the optimizer may not edit these

# --- who proposes edits --------------------------------------------------------
optimizer_skill: claude-code
optimizer_model: claude-opus-5-5
optimizer_max_turns: 400                 # generous; the $ cap below is the real ceiling
optimizer_usd_per_iter: 50               # per-iteration $ cap (claude --max-budget-usd)
optimizer_instructions_file: optimizer/INSTRUCTIONS.md # authored from the template, scoped to this arm
runner_repo_path: ../../vendor/tau2-bench # the tau2 clone, read-only context for the optimizer
target_model: aws/claude-haiku-4-5       # the gateway model the agent under test runs on
target_profile_file: ""

# --- how to iterate ------------------------------------------------------------
algorithm_skill: hill-climb
algorithm_focus: all
orchestration_mode: deterministic
memory_skill: md-files

# --- data + splits -------------------------------------------------------------
dataset_source: adapter                  # the adapter's tasks(): all 50 airline tasks
split_seed: 0
split_train: 0.5
split_val: 0.25
split_test: 0.25
split_ids_file: split_ids_budget.json    # pinned no-holdout split (train = val = test)

# --- scoring -------------------------------------------------------------------
num_trials: 5                            # trials per task (mean + SE + pass^k)
metrics_display: []
metric_primary: ""                       # blank = the tau2 reward
metric_directions: []

# --- acceptance gate -----------------------------------------------------------
gate_mode: paired                        # per-task paired SE
gate_k_se: 0.2

# --- budget --------------------------------------------------------------------
max_iterations: 3                        # three real optimizer iteration proves optimize -> gate -> finalize
stall: 3                                 # stop after N consecutive rejects
max_metric_calls: 0                      # 0 = unlimited
max_usd: 400                             # binds only on cost the adapter reports
max_optimizer_usd: 400                   # cumulative optimizer-only $ cap
stop_at_reward: 0.0                      # 0 = off

# --- integrations + store ------------------------------------------------------
github_integration: false
stop_condition: ""
store: git                               # every iteration committed for an inspectable process
