name: Deploy GitHub Pages

# Publish the cap-evolve site from site/ to GitHub Pages.
#
# Triggers:
#   - push to main that touches site/ or this workflow → auto-deploy
#   - manual dispatch → deploy on demand
#
# What it does: uploads site/ as the Pages artifact and hands it to the official Pages deploy
# action. No build step for site/ itself (static HTML/CSS/PNG only).
#
# Benchmark results are NOT built here any more. Since 2026-11 CI publishes them to the
# skillberry-runs org and the dashboard at https://skillberry-runs.github.io/dashboard/ renders
# them; site/benchmarks.html and site/benchmark-ui/runs/** are redirect pages to it.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/education/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; cancel any in-progress deploy when a
# newer commit lands.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Explicit ref: main — Pages must always deploy main's site/, whatever triggered this build.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify site/ exists
        run: |
          test -d site || { echo "no site/ directory"; exit 1; }
          test -f site/index.html || { echo "no site/index.html"; exit 1; }
          ls -la site/

      # The demo video is committed ONCE, at docs/assets/demo/, and folded into the Pages
      # artifact here.
      # Committing a second 15 MB copy under site/ just to serve it would double the repo
      # cost of every future re-render. Fail loudly rather than deploy a page whose <video>
      # 404s: a missing hero video is not a cosmetic problem.
      - name: Fold the demo video into site/
        run: |
          test -f docs/assets/demo/cap-evolve-demo.mp4 || {
            echo "docs/assets/demo/cap-evolve-demo.mp4 is missing — site/index.html embeds it"; exit 1; }
          mkdir -p site/assets/demo
          cp docs/assets/demo/cap-evolve-demo.mp4 site/assets/demo/
          ls -la site/assets/demo/

      # The onboarding course lives once, at docs/education/, and is folded in here like the
      # demo video. Its decks load four screenshots from ../assets/screenshots/ (docs/assets/
      # in the repo), so those files are copied next to it at the same relative path.
      - name: Fold the onboarding course into site/education/
        run: |
          test -f docs/education/index.html || { echo "docs/education/index.html is missing — site/index.html links to it"; exit 1; }
          cp -R docs/education site/education
          mkdir -p site/assets/screenshots
          for f in $(grep -ho 'src="\.\./assets/screenshots/[^"]*"' docs/education/*.html | sed 's|src="\.\./assets/screenshots/||; s|"$||' | sort -u); do
            cp "docs/assets/screenshots/$f" site/assets/screenshots/ || { echo "missing docs/assets/screenshots/$f"; exit 1; }
          done
          ls -la site/education site/assets/screenshots

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build CapEvolve dashboard shell (generic — data source is set at request time)
        working-directory: dashboard/frontend
        run: |
          npm ci
          VITE_STATIC=1 npx vite build --outDir "$GITHUB_WORKSPACE/site/dashboard-ui"

      # SkillsBench's pages moved to the skillberry-runs dashboard on 2026-11-17
      # (https://skillberry-runs.github.io/dashboard/skillsbench/). site/skillsbench/ now holds
      # only redirect pages, one per old address, so existing links keep working.

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
