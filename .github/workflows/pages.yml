name: Deploy GitHub Pages

# Publish the cap-evolve site from site/ to GitHub Pages.
#
# Triggers:
#   - push to main that touches site/ or this workflow → auto-deploy
#   - manual dispatch → deploy on demand (also how skillberry-runs/skillsbench's
#     notify-cap-evolve-pages.yml triggers a redeploy when its results change)
#   - the Benchmarks workflow completing → redeploy so a new run's CapEvolve UI
#     snapshot (benchmark-history's runs/**) becomes browsable, and its record
#     is reflected in the rendered benchmarks.json/meta.json (see below)
#
# What it does: uploads site/ (plus benchmark-history's runs/** folded in under
# site/benchmark-ui/runs/**) as the Pages artifact and hands it to the official
# Pages deploy action. No build step for site/ itself (static HTML/CSS/PNG only).
#
# benchmarks.json/meta.json are rendered here, fresh, from benchmark-history's
# records/ on every deploy — NOT committed to that branch. It's an aggregate over
# every run ever recorded, so committing it in full on every run would rewrite an
# ever-growing file forever (quadratic git growth); records/<id>.json stays
# git-committed (cheap: one small additive file per run) and is the source of truth.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Benchmarks"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; cancel any in-progress deploy when a
# newer commit lands.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Explicit ref: main — workflow_run's default checkout otherwise resolves to
      # the SHA of the triggering Benchmarks run, which can be a PR branch. Pages
      # must always deploy main's site/, regardless of what triggered this build.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify site/ exists
        run: |
          test -d site || { echo "no site/ directory"; exit 1; }
          test -f site/index.html || { echo "no site/index.html"; exit 1; }
          ls -la site/

      # The demo video is committed ONCE, at docs/assets/demo/, and folded into the Pages
      # artifact here — the same trick this workflow already uses for benchmark-history.
      # Committing a second 15 MB copy under site/ just to serve it would double the repo
      # cost of every future re-render. Fail loudly rather than deploy a page whose <video>
      # 404s: a missing hero video is not a cosmetic problem.
      - name: Fold the demo video into site/
        run: |
          test -f docs/assets/demo/cap-evolve-demo.mp4 || {
            echo "docs/assets/demo/cap-evolve-demo.mp4 is missing — site/index.html embeds it"; exit 1; }
          mkdir -p site/assets/demo
          cp docs/assets/demo/cap-evolve-demo.mp4 site/assets/demo/
          ls -la site/assets/demo/

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build CapEvolve dashboard shell (generic — data source is set at request time)
        working-directory: dashboard/frontend
        run: |
          npm ci
          VITE_STATIC=1 npx vite build --outDir "$GITHUB_WORKSPACE/site/dashboard-ui"

      - name: Fold in benchmark-history UI snapshots + render benchmarks.json
        run: |
          empty_feed() {
            python3 -c "import json; open('site/benchmarks.json', 'w').write(json.dumps([], indent=2))"
            python3 -c "import json; from datetime import datetime, timezone; open('site/meta.json', 'w').write(json.dumps({'count': 0, 'runs': 0, 'updated': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}, indent=2))"
          }
          rm -rf _bench_history
          if ! git clone --depth 1 --branch benchmark-history \
              "https://github.com/${{ github.repository }}.git" _bench_history; then
            echo "benchmark-history branch not found — deploying without UI snapshots or history"
            empty_feed
            exit 0
          fi
          mkdir -p site/benchmark-ui
          if [ -d _bench_history/runs ]; then
            cp -R _bench_history/runs site/benchmark-ui/runs
          fi
          if [ -d _bench_history/records ]; then
            python3 ci/benchmarks/lib/record.py aggregate _bench_history/records \
              --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --out site
          else
            empty_feed
          fi

      # SkillsBench summaries, heatmaps and per-task reports are rendered at deploy
      # time by scripts/build_skillsbench_site.py — see that script's docstring for
      # the design. site/skillsbench/index.html is the one file in this tree that's
      # hand-authored and committed on main; everything else here is generated fresh
      # on every deploy.
      #
      # Source: the private skillberry-runs/skillsbench repo (migrated, full history,
      # from this repo's skillsbench-history orphan branch on 2026-11-09). Reading it
      # needs SKILLSBENCH_READ_TOKEN — a skillberry-bot fine-grained token with
      # Contents: read on skillberry-runs/skillsbench. That repo's
      # notify-cap-evolve-pages.yml dispatches this workflow on every push to its main.
      #
      # Access policy: skillberry-runs/skillsbench is PRIVATE. Its write-ups are rendered
      # publicly here; its artifacts/ are not published, and every link into the repo is
      # labelled "(private)" (org members only). See build_skillsbench_site.py.
      #
      # Token expiry: the token is a fine-grained PAT with a fixed expiry date (rotated
      # yearly; it is the same token as skillberry-runs/dashboard's RESULTS_READ_TOKEN).
      # This step logs the date on every run and warns 30 days ahead. An expired or
      # broken token fails the deploy (the last good deploy stays live).
      #
      # Transition fallback, while the secret isn't configured yet: render the legacy
      # skillsbench-history branch instead (kept until the secret is in place), so the
      # live site doesn't change. If neither source is reachable, the committed
      # site/skillsbench/ snapshot deploys as-is, with a warning.
      - name: Fold in SkillsBench results (rendered)
        env:
          SKILLSBENCH_READ_TOKEN: ${{ secrets.SKILLSBENCH_READ_TOKEN }}
        run: |
          rm -rf _sbh
          if [ -n "$SKILLSBENCH_READ_TOKEN" ]; then
            git clone --depth 1 --branch main \
              "https://x-access-token:${SKILLSBENCH_READ_TOKEN}@github.com/skillberry-runs/skillsbench.git" _sbh || {
                echo "::error::SKILLSBENCH_READ_TOKEN is set but cloning skillberry-runs/skillsbench failed — expired or under-scoped token?"; exit 1; }
            SRC_ARGS="--source-repo skillberry-runs/skillsbench --source-ref main --source-private"
            # Fine-grained tokens expire on a fixed date. Log it on every deploy and warn
            # 30 days ahead, so an expiry never surprises anyone as a failed deploy.
            exp=$(curl -sI -H "Authorization: Bearer $SKILLSBENCH_READ_TOKEN" https://api.github.com/repos/skillberry-runs/skillsbench \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="github-authentication-token-expiration"{print $2}')
            if [ -n "$exp" ]; then
              days=$(python3 -c 'import sys,datetime as d; e=d.datetime.strptime(sys.argv[1][:19],"%Y-%m-%d %H:%M:%S"); print((e-d.datetime.utcnow()).days)' "$exp")
              echo "SKILLSBENCH_READ_TOKEN expires $exp ($days days from now)"
              if [ "$days" -lt 30 ]; then
                echo "::warning::SKILLSBENCH_READ_TOKEN expires in $days days ($exp). Regenerate skillberry-bot's 'skillberry-runs-read' token and update this secret (and RESULTS_READ_TOKEN in skillberry-runs/dashboard, which uses the same token)."
              fi
            fi
          else
            echo "::warning::SKILLSBENCH_READ_TOKEN not set — rendering the legacy skillsbench-history branch instead"
            git clone --depth 1 --branch skillsbench-history \
              "https://github.com/${{ github.repository }}.git" _sbh || {
                echo "::warning::no SkillsBench source reachable — deploying the committed site/skillsbench/ snapshot"; exit 0; }
            # Links must point at what was actually rendered: the public legacy branch.
            SRC_ARGS="--source-repo ${{ github.repository }} --source-ref skillsbench-history --source-public"
          fi
          pip install --quiet markdown
          python3 scripts/build_skillsbench_site.py --src _sbh --out site/skillsbench $SRC_ARGS
          test -f site/skillsbench/ui/heatmap.html || {
            echo "site/skillsbench/ui/heatmap.html missing after render — failing loudly"; exit 1; }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
