# ============================================================================
# Benchmarks — real optimization regression suite (reward / latency / cost).
# ============================================================================
#
# Runs, per benchmark, a curated set of tasks through cap-evolve using the ADAPTER
# TEMPLATES: agent aws/gpt-oss-120b, optimizer Claude Code @ claude-opus-4-8 by default —
# both models, trials, iterations, optimizer budget, gate strictness, and hill-climb
# focus are all workflow_dispatch inputs (see below).
# All of a tier's tasks are optimized TOGETHER in ONE run (train==val==test==all tier
# tasks — a no-holdout FIT; see ci/benchmarks/lib/run_suite.sh) — baseline and optimized
# are both measured within that same run, then CI reports reward/latency/cost base→opt
# and publishes the optimized capabilities for review.
#
# REAL models, real $ → NOT part of always-on CI. Runs ONLY when requested:
#   * manually  — Actions → "Benchmarks" → Run workflow (pick a benchmark), or
#   * on a PR   — add the `benchmark-test` label.
#
# REQUIRES a SELF-HOSTED runner on the IBM network (the gateway is VPC-internal;
# GitHub-hosted runners cannot reach it). See ci/benchmarks/README.md +
# ci/benchmarks/runner/arm-runner.sh. Repo secrets: ANTHROPIC_BASE_URL, ANTHROPIC_AUTH_TOKEN.
# ============================================================================

name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Which benchmark to run"
        type: choice
        default: all
        options: [all, tau2, swebench, skillsbench, spreadsheetbench]
      tier:
        description: "Which tier (default smoke; full is the whole/representative benchmark and is expensive)"
        type: choice
        default: smoke
        options: [all, smoke, full]
      iterations:
        description: "Optimizer iterations per task for the FULL tier (default 10; raise to give the optimizer more budget). Smoke always runs 3, regardless of this input."
        type: string
        default: "10"
      trials:
        description: "Trials per task per eval (default 10). Applies to whichever tier(s) run in this dispatch."
        type: string
        default: "10"
      agent_model:
        description: "Evaluation model — the agent under test (litellm_proxy alias on the ete-litellm gateway)"
        type: choice
        default: "aws/gpt-oss-120b"
        options:
          - "aws/gpt-oss-120b"
          - "aws/claude-sonnet-5"
          - "aws/claude-opus-5"
          - "claude-opus-4-8"
          - "aws/claude-opus-4-7"
          - "aws/us.claude-opus-4-7"
          - "claude-opus-4-6"
          - "aws/claude-haiku-4-5"
          - "aws/claude-sonnet-4-5"
          - "claude-sonnet-4-6"
          - "Azure/gpt-4o"
          - "Azure/gpt-4.1"
          - "Azure/gpt-5-2025-08-07"
          - "Azure/gpt-5-mini-2025-08-07"
          - "Azure/gpt-5-nano-2025-08-07"
          - "Azure/gpt-5.1-codex-2025-11-13"
          - "azure/gpt-5.3-codex"
          - "azure/gpt-5.3-chat"
          - "azure/gpt-5.4"
          - "azure/gpt-5.5"
          - "azure/gpt-5.6-sol"
          - "azure/gpt-5.6-luna"
          - "azure/gpt-5.6-terra"
          - "GCP/gemini-2.0-flash"
          - "gcp/gemini-2.5-flash"
          - "gcp/gemini-2.5-pro"
          - "gcp/gemini-3-pro-preview"
          - "gcp/gemini-3.1-pro-preview"
          - "gcp/gemini-3-flash-preview"
          - "rits/google/gemma-4-31B"
      optimizer_model:
        description: "Optimization model — the Claude Code optimizer's model (litellm_proxy alias on the ete-litellm gateway)"
        type: choice
        default: "claude-opus-4-8"
        options:
          - "aws/gpt-oss-120b"
          - "aws/claude-sonnet-5"
          - "aws/claude-opus-5"
          - "claude-opus-4-8"
          - "aws/claude-opus-4-7"
          - "aws/us.claude-opus-4-7"
          - "claude-opus-4-6"
          - "aws/claude-haiku-4-5"
          - "aws/claude-sonnet-4-5"
          - "claude-sonnet-4-6"
          - "Azure/gpt-4o"
          - "Azure/gpt-4.1"
          - "Azure/gpt-5-2025-08-07"
          - "Azure/gpt-5-mini-2025-08-07"
          - "Azure/gpt-5-nano-2025-08-07"
          - "Azure/gpt-5.1-codex-2025-11-13"
          - "azure/gpt-5.3-codex"
          - "azure/gpt-5.3-chat"
          - "azure/gpt-5.4"
          - "azure/gpt-5.5"
          - "azure/gpt-5.6-sol"
          - "azure/gpt-5.6-luna"
          - "azure/gpt-5.6-terra"
          - "GCP/gemini-2.0-flash"
          - "gcp/gemini-2.5-flash"
          - "gcp/gemini-2.5-pro"
          - "gcp/gemini-3-pro-preview"
          - "gcp/gemini-3.1-pro-preview"
          - "gcp/gemini-3-flash-preview"
          - "rits/google/gemma-4-31B"
      optimizer_usd_per_iter:
        description: "Per-iteration $ cap on the optimizer (default unlimited — 0 disables the native --max-budget-usd cap entirely; set e.g. 4.0 to bound spend)"
        type: string
        default: "0"
      optimizer_max_turns:
        description: "Per-iteration turn cap on the optimizer (default 80)"
        type: string
        default: "80"
      gate_k_se:
        description: "Acceptance-gate strictness: accept a candidate iff improvement > k_se·SE (default 1.0; lower = more lenient, higher = stricter)"
        type: string
        default: "1.0"
      algorithm_focus:
        description: "Hill-climb focus schedule: all (whole train set each iteration) | cyclic (one task at a time) | hardest-first (lowest-scoring task first)"
        type: choice
        default: all
        options: [all, cyclic, hardest-first]
  pull_request:
    types: [labeled]

jobs:
  bench:
    name: ${{ matrix.tier }} / ${{ matrix.bench }}
    runs-on: [self-hosted, ibm-vpc]
    # GitHub's default 360min job timeout is too tight for full/spreadsheetbench (912
    # tasks x trials x iterations, one Docker container per task); self-hosted runners
    # aren't GH-minute-billed, so a generous ceiling just prevents a silent mid-run kill.
    timeout-minutes: 1440
    # Repo default token is read-only; the "Comment results on the PR" step needs write.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    # Trust guard: run PR code from ANY repo (same-repo or a fork) on the self-hosted
    # runner only when the PR author is a known collaborator — never for outside/
    # first-time contributors, who could otherwise run arbitrary code with secrets.
    # PR trigger: any label containing 'benchmark-smoke' or 'benchmark-full'
    # (an all-label or a per-bench one). The per-matrix gate decides the exact tier×bench.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) &&
        (contains(join(github.event.pull_request.labels.*.name, ','), 'benchmark-smoke') ||
         contains(join(github.event.pull_request.labels.*.name, ','), 'benchmark-full')))
    strategy:
      fail-fast: false
      matrix:
        # tier is a first-class dimension. full runs the whole/representative benchmark
        # (frozen baselines under <bench>/full/); it no-ops until that tier is populated.
        tier: [smoke, full]
        bench: [tau2, swebench, skillsbench, spreadsheetbench]
    concurrency:
      group: benchmarks-${{ matrix.tier }}-${{ matrix.bench }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      # Smoke always runs a fixed 3 iterations (cheap, fast regression) — decoupled
      # from the `iterations` input, which only controls the (expensive) full tier
      # (default 10 there — see the `iterations` input above).
      ITERATIONS: ${{ matrix.tier == 'smoke' && '3' || github.event.inputs.iterations || '10' }}
      NUM_TRIALS: ${{ github.event.inputs.trials || '10' }}
      AGENT_MODEL: ${{ github.event.inputs.agent_model || 'aws/gpt-oss-120b' }}
      OPTIMIZER_MODEL: ${{ github.event.inputs.optimizer_model || 'claude-opus-4-8' }}
      # Smoke defaults to a $50/iteration cap (fast regression, generous headroom);
      # full stays unlimited by default. An explicit `optimizer_usd_per_iter`
      # dispatch input overrides this for whichever tier(s) run in that dispatch.
      OPTIMIZER_USD_PER_ITER: ${{ github.event.inputs.optimizer_usd_per_iter || (matrix.tier == 'smoke' && '50' || '0') }}
      OPTIMIZER_MAX_TURNS: ${{ github.event.inputs.optimizer_max_turns || '80' }}
      GATE_K_SE: ${{ github.event.inputs.gate_k_se || '1.0' }}
      ALGORITHM_FOCUS: ${{ github.event.inputs.algorithm_focus || 'all' }}
      TIER: ${{ matrix.tier }}
    steps:
      - uses: actions/checkout@v4

      - name: Gate (decide whether this tier/bench runs)
        id: gate
        env:
          # tier-agnostic exact-match label checks (evaluated by Actions, not the shell):
          #   benchmark-<tier>  = all benches of this tier;  benchmark-<tier>-<bench> = this one
          HAS_ALL: ${{ contains(github.event.pull_request.labels.*.name, format('benchmark-{0}', matrix.tier)) }}
          HAS_THIS: ${{ contains(github.event.pull_request.labels.*.name, format('benchmark-{0}-{1}', matrix.tier, matrix.bench)) }}
          TIER_SEL: ${{ github.event.inputs.tier || 'smoke' }}
          BENCH_SEL: ${{ github.event.inputs.benchmark || 'all' }}
        run: |
          run=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tier_ok=false; bench_ok=false
            { [ "$TIER_SEL" = "all" ] || [ "$TIER_SEL" = "${{ matrix.tier }}" ]; } && tier_ok=true
            { [ "$BENCH_SEL" = "all" ] || [ "$BENCH_SEL" = "${{ matrix.bench }}" ]; } && bench_ok=true
            if [ "$tier_ok" = true ] && [ "$bench_ok" = true ]; then run=true; fi
          else
            # pull_request: benchmark-<tier> (all of tier) OR benchmark-<tier>-<bench>
            if [ "$HAS_ALL" = "true" ] || [ "$HAS_THIS" = "true" ]; then run=true; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Setup runner env
        if: steps.gate.outputs.run == 'true'
        run: bash ci/benchmarks/lib/ci_setup.sh "${{ matrix.bench }}"

      - name: Start live snapshot poller
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_dir="$GITHUB_WORKSPACE/ci/benchmarks/.work/suite_${{ matrix.tier }}_${{ matrix.bench }}_proj/.capevolve/run_suite"
          nohup bash ci/benchmarks/lib/live_push.sh "$run_dir" "${{ github.run_id }}" "${{ matrix.tier }}-${{ matrix.bench }}" \
            > "$RUNNER_TEMP/live_push_${{ matrix.tier }}_${{ matrix.bench }}.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/live_push_${{ matrix.tier }}_${{ matrix.bench }}.pid"
          disown

      - name: Run suite
        if: steps.gate.outputs.run == 'true'
        run: bash ci/benchmarks/lib/run_suite.sh "${{ matrix.bench }}" "$GITHUB_WORKSPACE/ci/benchmarks/.work/suite_${{ matrix.tier }}_${{ matrix.bench }}"

      - name: Stop live snapshot poller
        if: steps.gate.outputs.run == 'true' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pidfile="$RUNNER_TEMP/live_push_${{ matrix.tier }}_${{ matrix.bench }}.pid"
          if [ -f "$pidfile" ]; then
            kill "$(cat "$pidfile")" 2>/dev/null || true
            rm -f "$pidfile"
          fi
          bash ci/benchmarks/lib/live_push.sh --cleanup "${{ github.run_id }}" "${{ matrix.tier }}-${{ matrix.bench }}" \
            || echo "::warning::live cleanup push failed (best-effort, no action needed)"

      - name: Export CapEvolve UI snapshot
        if: steps.gate.outputs.run == 'true' && always()
        run: |
          run_dir="$GITHUB_WORKSPACE/ci/benchmarks/.work/suite_${{ matrix.tier }}_${{ matrix.bench }}_proj/.capevolve/run_suite"
          out="$GITHUB_WORKSPACE/ci/benchmarks/.work/suite_${{ matrix.tier }}_${{ matrix.bench }}"
          if [ -f "$run_dir/events.jsonl" ]; then
            PYTHONPATH="$GITHUB_WORKSPACE/dashboard/backend" "$CAPEVOLVE_PY" -m capevolve_dashboard.export_static \
              --base "$(dirname "$run_dir")" --run-id run_suite --out "$out/ui/data" \
              || echo "::warning::UI export failed for ${{ matrix.tier }}/${{ matrix.bench }} (best-effort, continuing)"
          else
            echo "no run dir at $run_dir (job likely failed/cancelled before producing one) — skipping UI export"
          fi

      - name: Write run metadata
        if: steps.gate.outputs.run == 'true' && always()
        run: |
          out="$GITHUB_WORKSPACE/ci/benchmarks/.work/suite_${{ matrix.tier }}_${{ matrix.bench }}"
          mkdir -p "$out"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            source="PR #${{ github.event.pull_request.number }}"; pr="${{ github.event.pull_request.number }}"
          else
            source="manual (${{ github.ref_name }})"; pr="null"
          fi
          cat > "$out/runmeta.json" <<JSON
          {
            "run_id": ${{ github.run_id }},
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "bench": "${{ matrix.bench }}",
            "tier": "${{ matrix.tier }}",
            "event": "${{ github.event_name }}",
            "source": "$source",
            "pr": $pr,
            "branch": "${{ github.head_ref || github.ref_name }}",
            "sha": "${{ github.event.pull_request.head.sha || github.sha }}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "iterations": ${ITERATIONS:-3},
            "trials": ${NUM_TRIALS:-10},
            "agent_model": "${AGENT_MODEL:-aws/gpt-oss-120b}",
            "optimizer_model": "${OPTIMIZER_MODEL:-claude-opus-4-8}",
            "conclusion": "${{ job.status }}"
          }
          JSON
          cat "$out/runmeta.json"

      - name: Upload artifacts (metrics + optimized capabilities)
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ matrix.tier }}-${{ matrix.bench }}
          path: ci/benchmarks/.work/suite_${{ matrix.tier }}_${{ matrix.bench }}/**
          if-no-files-found: warn

      - name: Comment results on the PR
        if: steps.gate.outputs.run == 'true' && github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `ci/benchmarks/.work/suite_${{ matrix.tier }}_${{ matrix.bench }}/report.md`;
            if (!fs.existsSync(path)) return;
            const body = `<!-- benchmarks:${{ matrix.tier }}-${{ matrix.bench }} -->\n` + fs.readFileSync(path, 'utf8');
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const marker = `<!-- benchmarks:${{ matrix.tier }}-${{ matrix.bench }} -->`;
            const {data: comments} = await github.rest.issues.listComments({owner, repo, issue_number});
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

  # Collect each run's per-(run x bench) record onto the benchmark-history branch (single
  # writer → no push races) and regenerate benchmarks.json for the Pages history page.
  # Runs on a GitHub-hosted runner (JSON + git only; no VPC access needed).
  aggregate:
    name: aggregate history
    needs: [bench]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: benchmark-history-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4              # for ci/benchmarks/lib/record.py

      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          path: _artifacts
          pattern: benchmarks-*

      - name: Check for UI snapshots
        id: uicheck
        run: |
          if find _artifacts -type d -path '*/ui/data' 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js 22
        if: steps.uicheck.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build static dashboard shell
        if: steps.uicheck.outputs.found == 'true'
        working-directory: dashboard/frontend
        run: |
          npm ci
          VITE_STATIC=1 npx vite build --outDir "$RUNNER_TEMP/ui_shell"

      - name: Build records + assemble UI snapshots
        run: |
          # upload-artifact stores files flat at the artifact root (the least-common-ancestor
          # of ci/benchmarks/.work/suite_<tier>_<bench>/** is that dir), so runmeta.json/
          # metrics.jsonl/ui/ live directly under _artifacts/benchmarks-<tier>-<bench>/. The dir
          # suffix is the <tier>-<bench> slug — use it verbatim to keep record files unique
          # per (run, tier, bench) so smoke and full of the same bench never collide.
          mkdir -p _new_records _hist_runs
          have=0; built=0
          for d in _artifacts/benchmarks-*; do
            [ -d "$d" ] || continue
            slug="$(basename "$d" | sed 's/^benchmarks-//')"   # e.g. smoke-tau2 / full-tau2
            rm="$d/runmeta.json"; metrics="$d/metrics.jsonl"; steps="$d/steps.jsonl"
            [ -f "$rm" ] || { echo "::warning::no runmeta for $slug, skipping"; continue; }
            have=$((have+1))
            rid="$(python3 -c "import json;print(json.load(open('$rm'))['run_id'])")"
            has_ui_flag=""
            if [ -d "$d/ui/data" ] && [ -n "$(ls -A "$d/ui/data" 2>/dev/null)" ]; then
              dest="_hist_runs/${rid}__${slug}/ui"
              mkdir -p "$dest"
              cp -R "$RUNNER_TEMP/ui_shell/." "$dest/"
              cp -R "$d/ui/data" "$dest/data"
              has_ui_flag="--has-ui"
            fi
            python3 ci/benchmarks/lib/record.py build "$metrics" --runmeta "$rm" --steps "$steps" $has_ui_flag \
              > "_new_records/${rid}__${slug}.json" && built=$((built+1))
            echo "built _new_records/${rid}__${slug}.json"
          done
          ls -la _new_records || true
          # Guard: if artifacts with runmeta exist but produced no records, fail loudly
          # instead of silently exiting 0 (which previously masked a path bug).
          if [ "$have" -gt 0 ] && [ "$built" -lt "$have" ]; then
            echo "::error::found $have runmeta artifact(s) but built only $built record(s)"; exit 1
          fi

      - name: Push to benchmark-history (single writer, with rebase-retry)
        run: |
          [ -n "$(ls -A _new_records 2>/dev/null)" ] || { echo "no records to push"; exit 0; }
          git config --global user.name "skillberry-bot"
          git config --global user.email "actions@github.com"
          for attempt in 1 2 3 4 5; do
            rm -rf _hist
            git clone --depth 1 --branch benchmark-history \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" _hist || {
                echo "branch missing — bootstrap it per ci/benchmarks/README.md"; exit 1; }
            mkdir -p _hist/records
            cp _new_records/*.json _hist/records/
            if [ -d _hist_runs ] && [ -n "$(ls -A _hist_runs 2>/dev/null)" ]; then
              mkdir -p _hist/runs
              cp -R _hist_runs/. _hist/runs/
            fi
            python3 ci/benchmarks/lib/record.py aggregate _hist/records \
              --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --out _hist
            cd _hist
            git add records benchmarks.json meta.json
            [ -d runs ] && git add runs
            git commit -m "bench: record run ${{ github.run_id }}" || { echo "nothing to commit"; exit 0; }
            if git push origin benchmark-history; then echo "pushed"; exit 0; fi
            echo "push race, retrying ($attempt)"; cd ..; sleep 3
          done
          echo "failed to push after retries"; exit 1
