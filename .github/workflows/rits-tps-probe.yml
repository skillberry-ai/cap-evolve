# ============================================================================
# RITS throughput probe — tokens/second of a RITS model family (default: GLM).
# ============================================================================
#
# 1. Finds lite-rits's scraped rits.json on skillberry-1 (lite-rits's /v1/models is empty
#    by design, so the catalog file is the only listing) and prints the models whose id
#    matches MODEL_PATTERN.
# 2. Sends a fixed prompt to each match through IBM_RITS_API_BASE and reports TTFT,
#    decode tok/s and end-to-end tok/s (ci/benchmarks/lib/rits_tps_probe.py).
#
# Pinned to skillberry-1: only that runner has the lite-rits proxy on localhost:4000.
# Runs on manual dispatch, or on a PR that changes this workflow / the probe script.
# ============================================================================

name: RITS throughput probe

on:
  workflow_dispatch:
    inputs:
      model_pattern:
        description: "Case-insensitive regex on the RITS <vendor>/<model> id"
        default: "glm"
      trials:
        description: "Streaming requests per model"
        default: "3"
      max_tokens:
        description: "max_tokens per request"
        default: "1024"
  pull_request:
    paths:
      - .github/workflows/rits-tps-probe.yml
      - ci/benchmarks/lib/rits_tps_probe.py

jobs:
  probe:
    runs-on: [self-hosted, ibm-vpc, skillberry-1]
    # Same trust guard as integration-tests.yml: PR code with secrets on the self-hosted
    # runner only for known collaborators.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    timeout-minutes: 30
    env:
      IBM_RITS_API_BASE: ${{ secrets.IBM_RITS_API_BASE }}
      IBM_RITS_API_KEY: ${{ secrets.IBM_RITS_API_KEY }}
      MODEL_PATTERN: ${{ github.event.inputs.model_pattern || 'glm' }}
      TRIALS: ${{ github.event.inputs.trials || '3' }}
      MAX_TOKENS: ${{ github.event.inputs.max_tokens || '1024' }}
    steps:
      - uses: actions/checkout@v4
      - name: Find matching models in lite-rits's rits.json
        id: find
        run: |
          set -uo pipefail
          cat_file=/tmp/rits_catalog.json
          : > "$cat_file"
          # The catalog lives inside the lite-rits container; fall back to the host file system.
          for c in $(docker ps --format '{{.Names}} {{.Image}}' 2>/dev/null | grep -i rits | awk '{print $1}'); do
            echo "lite-rits container: $c"
            p="$(docker exec "$c" sh -c 'find / -name rits.json -not -path "/proc/*" 2>/dev/null | head -1')"
            if [ -n "$p" ]; then
              echo "catalog: $c:$p"
              docker exec "$c" cat "$p" > "$cat_file" && break
            fi
          done
          if [ ! -s "$cat_file" ]; then
            p="$(find "$HOME" /opt /srv -name rits.json 2>/dev/null | head -1)"
            [ -n "$p" ] && echo "catalog: $p" && cp "$p" "$cat_file"
          fi
          if [ ! -s "$cat_file" ]; then
            echo "::error:: could not find rits.json on this runner"; exit 1
          fi
          python3 - "$cat_file" <<'PY' > /tmp/models.txt
          import json, os, re, sys
          data = json.load(open(sys.argv[1]))
          # Collect every string that looks like a "<vendor>/<model>" id, whatever the file shape.
          ids = set()
          def walk(x):
              if isinstance(x, dict):
                  for k, v in x.items():
                      if isinstance(k, str) and "/" in k and " " not in k:
                          ids.add(k)
                      walk(v)
              elif isinstance(x, list):
                  for v in x: walk(v)
              elif isinstance(x, str) and re.fullmatch(r"[\w.\-]+/[\w.\-:]+", x):
                  ids.add(x)
          walk(data)
          print(f"catalog: {len(ids)} vendor/model ids", file=sys.stderr)
          pat = re.compile(os.environ["MODEL_PATTERN"], re.I)
          for m in sorted(i for i in ids if pat.search(i)):
              print(m)
          PY
          echo "Models matching /$MODEL_PATTERN/i:"
          cat /tmp/models.txt
          {
            echo "## RITS models matching \`/$MODEL_PATTERN/i\`"
            echo
            if [ -s /tmp/models.txt ]; then sed 's/^/- `/; s/$/`/' /tmp/models.txt; else echo "_none_"; fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s /tmp/models.txt ]; then
            echo "::warning:: no RITS model matches /$MODEL_PATTERN/i"
          fi
      - name: Measure tokens/second
        run: |
          set -euo pipefail
          [ -s /tmp/models.txt ] || { echo "nothing to probe"; exit 0; }
          # lite-rits only routes ids that keep the "rits/" wire prefix (see resolve_provider.sh).
          mapfile -t models < <(sed 's#^#rits/#' /tmp/models.txt)
          python3 ci/benchmarks/lib/rits_tps_probe.py "${models[@]}"
