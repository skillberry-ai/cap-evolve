}, {"t": "add", "l": "+      \"title\": \"review-agent Criterion 3: named spec-vs-content overlap pattern\","}, {"t": "add", "l": "+      \"files\": [\"epic-decompose/prompts/review-agent.md\"],"}, {"t": "add", "l": "+      \"lever\": \"KNOWLEDGE\","}, {"t": "add", "l": "+      \"clusters\": [\"A\"],"}, {"t": "add", "l": "+      \"blast_radius\": \"BOUNDED\","}, {"t": "add", "l": "+      \"verified\": \"Pattern absent from all 7 passing tasks' artifacts (verified by predicate scan); wording mirrors the 019 re-review's own finding.\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"E7\","}, {"t": "add", "l": "+      \"title\": \"review-agent Criterion 6: named gating-coverage pattern\","}, {"t": "add", "l": "+      \"files\": [\"epic-decompose/prompts/review-agent.md\"],"}, {"t": "add", "l": "+      \"lever\": \"KNOWLEDGE\","}, {"t": "add", "l": "+      \"clusters\": [\"C\"],"}, {"t": "add", "l": "+      \"blast_radius\": \"BOUNDED\","}, {"t": "add", "l": "+      \"verified\": \"Pattern absent from all 7 passing tasks' artifacts.\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"E8\","}, {"t": "add", "l": "+      \"title\": \"revise-agent Step 2: enumerated must-fix defect classes for minors + preserved judgment latitude for observations\","}, {"t": "add", "l": "+      \"files\": [\"epic-decompose/prompts/revise-agent.md\"],"}, {"t": "add", "l": "+      \"lever\": \"BEHAVIORAL\","}, {"t": "add", "l": "+      \"clusters\": [\"A\", \"B\", \"C\", \"D\"],"}, {"t": "add", "l": "+      \"blast_radius\": \"BOUNDED\","}, {"t": "add", "l": "+      \"verified\": \"Per-task trace check: 013 (no issues), 015/016 (observation minors left as now), 017 (signal fix keeps latitude), 018/020 (majors already fixed) \u2014 no passing task's revise behavior flips.\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"E9\","}, {"t": "add", "l": "+      \"title\": \"revise-agent Epic Boundary recipe: spec-vs-content overlap (stub or subsume, never merge)\","}, {"t": "add", "l": "+      \"files\": [\"epic-decompose/prompts/revise-agent.md\"],"}, {"t": "add", "l": "+      \"lever\": \"KNOWLEDGE\","}, {"t": "add", "l": "+      \"clusters\": [\"A\"],"}, {"t": "add", "l": "+      \"blast_radius\": \"BOUNDED\","}, {"t": "add", "l": "+      \"verified\": \"Fires only on the overlap class (absent from passing tasks); prevents the wrong merge-style fix.\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"E10\","}, {"t": "add", "l": "+      \"title\": \"revise-agent Step 4: re-run check script to exit 0 after corrections\","}, {"t": "add", "l": "+      \"files\": [\"epic-decompose/prompts/revise-agent.md\"],"}, {"t": "add", "l": "+      \"lever\": \"BEHAVIORAL\","}, {"t": "add", "l": "+      \"clusters\": [\"A\", \"B\", \"C\", \"D\"],"}, {"t": "add", "l": "+      \"blast_radius\": \"BOUNDED\","}, {"t": "add", "l": "+      \"verified\": \"Script exits 0 on all 7 passing tasks' post-revision (= final) artifacts, verified directly.\""}, {"t": "add", "l": "+    }"}, {"t": "add", "l": "+  ],"}, {"t": "add", "l": "+  \"skipped\": ["}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"title\": \"gate_failure_impact / gated_by completeness check in the script\","}, {"t": "add", "l": "+      \"reason\": \"Mechanically implementable but fires on passing case-020's post-decompose state (its first review flagged exactly this class); would change a passing task's trajectory without verification that the decomposer-time fix lands identically to the revise-time fix.\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"title\": \"Review recommends revise whenever minors remain\","}, {"t": "add", "l": "+      \"reason\": \"Unbounded: 015/016/018/020 pass with observation minors and score 5/5; forcing more revision cycles churns passing decompositions with no scored upside.\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"title\": \"SKILL.md description/body edits\","}, {"t": "add", "l": "+      \"reason\": \"Skill triggers and runs correctly on all 8 val tasks; no defect in this cluster lives in the orchestrator prompt; description edits risk trigger behavior.\""}, {"t": "add", "l": "+    }"}, {"t": "add", "l": "+  ],"}, {"t": "add", "l": "+  \"techniques\": ["}, {"t": "add", "l": "+    \"skipped-prose-step -> bundled script with --self-check (skill-package lever 2)\","}, {"t": "add", "l": "+    \"missing-rule with worked example (decompose Step 5)\","}, {"t": "add", "l": "+    \"decision-rule narrowing via enumerated must-fix classes (revise Step 2)\","}, {"t": "add", "l": "+    \"review-rubric pattern naming (worked counterexample for a strong-tier reader)\","}, {"t": "add", "l": "+    \"verification step with exit-0 gate before pipeline sentinel\","}, {"t": "add", "l": "+    \"programmatic blast-radius scan of all 8 trajectories' artifacts before keeping each edit\""}, {"t": "add", "l": "+  ]"}, {"t": "add", "l": "+}"}]}, {"file": "epic-decompose/prompts/decompose-agent.md", "rows": [{"t": "hunk", "l": "@@ -108,4 +108,5 @@"}, {"t": "ctx", "l": "    - **Architectural sub-system boundaries**: backend API vs. frontend plugin, Go service vs. React UI, etc."}, {"t": "ctx", "l": "    - **Work-product type boundaries**: code implementation, content authoring (sample notebooks, tutorials, curated examples), and documentation are different kinds of work \u2014 they require different skills, different review criteria, and produce different PR review cycles. An epic that mixes code implementation with content authoring should be split even if the same team owns both. **Exception \u2014 incidental documentation touch-ups:** updating captions, screenshots, or references that fall out of a code change (no new content authored) is not a separate work stream \u2014 fold it into the originating epic as scope/acceptance criteria rather than a standalone `docs-authoring` epic. Only substantive content/documentation authoring (new tutorials, sample notebooks, curated examples, new or rewritten doc topics), or a strategy with `Documentation Support: Yes`, warrants a separate epic."}, {"t": "add", "l": "+   - **Spec-vs-content boundary**: when one epic defines a format, schema, or standard and a sibling epic authors the real artifacts in that format (tutorials, notebooks, guides, curated examples), the defining epic validates the format with a **minimal format-validation stub** \u2014 a small fixture that exercises the format \u2014 and must NOT author a real, usable content instance. \"Produce a reference example of a correctly packaged tutorial\" inside the format-defining epic duplicates the authoring epic's deliverable: two epics would produce the same kind of work product under different quality bars and review processes. Either state the stub explicitly in the defining epic's scope (\"a minimal validation fixture demonstrating the format, not a usable deliverable\") or move the example into the authoring epic's scope, leaving the defining epic to reference only the format it specifies."}, {"t": "ctx", "l": "    These axes take precedence when deciding where to draw epic boundaries within a component. Step 4 may additionally split by priority when features are genuinely deferrable \u2014 but the initial boundary structure should come from architecture and work-product type, not from walking down the HLR list. Never split such that two epics must build the same data structure, UI surface, or API endpoint independently."}, {"t": "ctx", "l": " "}, {"t": "hunk", "l": "@@ -233,4 +234,5 @@"}, {"t": "ctx", "l": " - Implementation-specific requirements (build pipeline green, rollback plan, doc review, etc.)"}, {"t": "ctx", "l": " - Rules 23-25 from Step 5"}, {"t": "add", "l": "+- **Gating coverage**: any rollout gate an epic's scope names (feature flag, dashboard config gate, toggle) gets a matching acceptance criterion verifying the gated behavior (e.g., \"Given the feature flag is disabled, the surface is not visible; given it is enabled, <behavior> holds\"). Scope that names a gate with no verifying AC is an untestable promise \u2014 either add the AC or drop the gate from scope."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " ## Step 8: Generate Artifacts"}, {"t": "hunk", "l": "@@ -330,5 +332,14 @@"}, {"t": "ctx", "l": " Compare the output against the decomposition summary. If any epic file's `dependencies`, `priority`, `type`, or HLR mappings diverged from the plan, fix the epic file to match the summary."}, {"t": "ctx", "l": " "}, {"t": "del", "l": "-Then, as your **final action** \u2014 after every epic file is written and any divergence is fixed \u2014 mark the decomposition complete:"}, {"t": "add", "l": "+Then run the bundled consistency check (execute it \u2014 do not read its source):"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```bash"}, {"t": "add", "l": "+CHECK=\"$(ls skills/epic-decompose/*/scripts/check_decomposition.py skills/epic-decompose/scripts/check_decomposition.py 2>/dev/null | head -1)\""}, {"t": "add", "l": "+python3 \"$CHECK\" {ID}"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Each `FINDING [class] file` line it prints names a concrete defect and its fix: docs-authoring priority not derived from the strategy's Jira priority, a rollout gate named in scope with no matching AC, a spec/format epic producing real content a sibling authoring epic also produces, and structural DAG/file-contract breaches. Fix every finding by editing the named file as described, then re-run until it exits 0 (`OK: no consistency findings`). Do not set `decompose_complete=true` while findings remain \u2014 the review agent runs the same check, so an unfixed finding will be flagged again downstream."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Then, as your **final action** \u2014 after every epic file is written, any divergence is fixed, and the consistency check exits 0 \u2014 mark the decomposition complete:"}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " ```"}]}, {"file": "epic-decompose/prompts/review-agent.md", "rows": [{"t": "hunk", "l": "@@ -37,4 +37,21 @@"}, {"t": "ctx", "l": " ## Step 2: Review Against Quality Criteria"}, {"t": "ctx", "l": " "}, {"t": "add", "l": "+### Step 2.0: Mechanical pre-check"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Before applying the rubric, run the bundled consistency check (execute it \u2014 do not read its source):"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```bash"}, {"t": "add", "l": "+CHECK=\"$(ls skills/epic-decompose/*/scripts/check_decomposition.py skills/epic-decompose/scripts/check_decomposition.py 2>/dev/null | head -1)\""}, {"t": "add", "l": "+python3 \"$CHECK\" {ID}"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Every `FINDING [class] file` line it prints is a real defect with its fix stated. Fold each finding into the `issues` list and the matching criterion's details:"}, {"t": "add", "l": "+- `docs-priority` \u2192 Criterion 1 (HLR Coverage) \u2014 minor"}, {"t": "add", "l": "+- `gating-ac` \u2192 Criterion 6 (Acceptance Criteria Quality) \u2014 minor"}, {"t": "add", "l": "+- `spec-content` \u2192 Criterion 3 (Epic Boundaries) \u2014 minor, major when the duplication is substantive"}, {"t": "add", "l": "+- `structure` (unresolvable dependency, branch metadata breach, main-plan epic depending on a branch epic, `epic_count` mismatch, missing ai-signals rationale file, sibling draft-ID references) \u2192 Criterion 2 (DAG Coherence) or Criterion 5/6 as appropriate \u2014 at least major, critical for unresolvable dependencies and branch-metadata breaches"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+An exit 0 clears only these mechanical classes \u2014 apply the full rubric below as usual; the check does not replace your judgment on anything semantic."}, {"t": "add", "l": "+"}, {"t": "ctx", "l": " Evaluate the decomposition against these 7 criteria. For each, note specific issues found with severity:"}, {"t": "ctx", "l": " "}, {"t": "hunk", "l": "@@ -65,5 +82,5 @@"}, {"t": "ctx", "l": " - **0**: Epics violate the component/team boundary rule (work for different teams bundled into one epic), or an epic is clearly oversized (multiple sprints of work)."}, {"t": "ctx", "l": " "}, {"t": "del", "l": "-Check: For each epic, verify component and team fields. Look for epics that bundle work across multiple components or teams. **Also check for scope duplication across sibling epics:** compare the scope sections and acceptance criteria of all epics. If two or more epics independently build the same data structure, UI surface, API endpoint, or component (e.g., both create a benchmark list with status indicators, or both implement log viewing against the same endpoint), that is a major issue \u2014 it means the boundary was drawn incorrectly and the epics should be merged or re-split along a different axis. Minor incidental overlap (e.g., both epics mention the same config value) is not duplication. **Also check for work-product type mixing:** if a single epic bundles code implementation with content authoring (sample notebooks, tutorials, curated examples), flag as a major issue \u2014 these are different kinds of work with different review criteria and should be separate epics even when owned by the same team."}, {"t": "add", "l": "+Check: For each epic, verify component and team fields. Look for epics that bundle work across multiple components or teams. **Also check for scope duplication across sibling epics:** compare the scope sections and acceptance criteria of all epics. If two or more epics independently build the same data structure, UI surface, API endpoint, or component (e.g., both create a benchmark list with status indicators, or both implement log viewing against the same endpoint), that is a major issue \u2014 it means the boundary was drawn incorrectly and the epics should be merged or re-split along a different axis. Minor incidental overlap (e.g., both epics mention the same config value) is not duplication. **Also check for work-product type mixing:** if a single epic bundles code implementation with content authoring (sample notebooks, tutorials, curated examples), flag as a major issue \u2014 these are different kinds of work with different review criteria and should be separate epics even when owned by the same team. **Also check for spec-vs-content overlap across siblings:** a format/schema/standard-defining epic whose scope or acceptance criteria produce real instances of a sibling content epic's deliverable (e.g., a packaging-format epic whose scope includes producing a reference tutorial while a sibling epic authors the actual tutorials) is a boundary overlap \u2014 the defining epic must validate with a minimal format-validation stub, or the example must be subsumed into the authoring epic's scope. Flag as minor when the duplication is incidental, major when two epics would independently produce the same deliverable."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " ### Criterion 4: Type Correctness (0-2 points)"}, {"t": "hunk", "l": "@@ -91,5 +108,5 @@"}, {"t": "ctx", "l": " - **0**: Epics have no ACs, or ACs are vague/untestable across multiple epics, or multiple rule-mandated ACs are missing."}, {"t": "ctx", "l": " "}, {"t": "del", "l": "-Check: Verify each epic has ACs. Check that replacement epics have rollback/feature-flag ACs, docs-authoring has technical review AC, and konflux-chain epics have build pipeline AC. Any missing rule-mandated AC is a major issue \u2014 this applies to every epic that meets the rule's criteria, not just the first or most obvious one. Also check that epic bodies do not reference sibling epics by draft ID (e.g., \"E001\", \"E003\") \u2014 draft IDs are meaningless in Jira. Each reference is a minor issue; 3+ across the decomposition costs a point."}, {"t": "add", "l": "+Check: Verify each epic has ACs. Check that replacement epics have rollback/feature-flag ACs, docs-authoring has technical review AC, and konflux-chain epics have build pipeline AC. Any missing rule-mandated AC is a major issue \u2014 this applies to every epic that meets the rule's criteria, not just the first or most obvious one. **Also check gating coverage:** any rollout gate an epic's scope names (feature flag, dashboard config gate, toggle) must have a matching acceptance criterion verifying the gated behavior \u2014 a gate named in scope with no verifying AC is a listed issue (minor; major when the gate is the primary rollout mechanism for the epic's user-facing surface). Also check that epic bodies do not reference sibling epics by draft ID (e.g., \"E001\", \"E003\") \u2014 draft IDs are meaningless in Jira. Each reference is a minor issue; 3+ across the decomposition costs a point."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " ### Criterion 7: Completeness (0-2 points)"}]}, {"file": "epic-decompose/prompts/revise-agent.md", "rows": [{"t": "hunk", "l": "@@ -22,4 +22,12 @@"}, {"t": "ctx", "l": " **Only fix issues the reviewer identified.** If a criterion scored full points, don't touch it. Never rewrite the entire decomposition from scratch."}, {"t": "ctx", "l": " "}, {"t": "add", "l": "+**Severity does not mean optional for defect findings.** Fix every listed issue in these classes even when the reviewer marked it `minor` \u2014 an issue left unfixed here survives into the final artifacts, because the pipeline finishes after the next review passes:"}, {"t": "add", "l": "+- **Boundary overlap**: an epic's scope or ACs produce a deliverable a sibling epic also produces (including a format-defining epic authoring real content instances) \u2014 restate as a validation stub, subsume the example into the authoring epic, or re-split along the correct axis."}, {"t": "add", "l": "+- **Rollout gate named in scope with no matching AC**: add the AC verifying the gated behavior."}, {"t": "add", "l": "+- **Docs-authoring priority not derived from the strategy's Jira priority** (Critical\u2192P0, Major\u2192P1, Normal/Minor/missing\u2192P2): set the derived value."}, {"t": "add", "l": "+- **Structural breach**: a dependency referencing a nonexistent epic, a branch file missing `branch`/`gated_by`, `epic_count` not matching the epic files on disk, a missing `-ai-signals.md` rationale file, sibling draft-ID references in epic bodies."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+For any other minor \u2014 an observation about a defensible choice (e.g., \"bundling is defensible because the requirements share a surface\", \"this signal value is arguable\") \u2014 decide as you would without this rule: fix it when the fix is clearly an improvement, otherwise leave it and note the reasoning in the decomposition summary's health warnings."}, {"t": "add", "l": "+"}, {"t": "ctx", "l": " If the review passed all criteria with no issues to fix, skip to Step 3."}, {"t": "ctx", "l": " "}, {"t": "hunk", "l": "@@ -38,4 +46,5 @@"}, {"t": "ctx", "l": " - **Triage inconsistency** (`triage: below-threshold` or `docs-only` with `epic_count > 1`): The decomposer applied multi-epic logic after triage should have stopped the flow. Merge all epics back into a single epic `{ID}-E001.md`. Combine the scope, acceptance criteria, and HLR traceability from all existing epics into the single file. Delete the extra epic files and their AI signal files. Update the decomposition summary to reflect `epic_count: 1` and `critical_path_length: 1`."}, {"t": "ctx", "l": " - **Scope duplication across sibling epics**: Two or more epics independently build the same data structure, UI surface, or API endpoint. Merge the overlapping epics into one, or re-split along an architectural sub-system boundary (e.g., backend vs. frontend) instead of the current axis. Deduplicate acceptance criteria and scope. Delete any epic files that were merged away and update the decomposition summary."}, {"t": "add", "l": "+- **Spec-vs-content overlap**: A format/schema/standard-defining epic's scope or ACs produce real content instances that a sibling authoring epic also produces. Do NOT merge the two epics \u2014 the format/consumer boundary is correct. Restate the defining epic's example as a minimal format-validation stub (a fixture exercising the format, not a usable deliverable), or explicitly subsume the example into the authoring epic's scope and remove it from the defining epic."}, {"t": "ctx", "l": " - **Multi-component/team epic**: Split into separate epics per the component/team tuple rule. Assign new epic IDs continuing the sequence (e.g., if last epic is E007, new ones are E008, E009)."}, {"t": "ctx", "l": " - **Oversized epic**: Split by sub-deliverable into smaller epics."}, {"t": "hunk", "l": "@@ -89,3 +98,10 @@"}, {"t": "ctx", "l": " - `epic_count` in the summary matches the actual number of epic files"}, {"t": "ctx", "l": " "}, {"t": "del", "l": "-Do not return a summary. Your work is complete when you have run `frontmatter.py set` with `revised=true` (changes made) or `revised=false` (no corrections needed). The pipeline uses this field to detect that the revision agent has finished."}, {"t": "add", "l": "+If you applied corrections, also run the bundled consistency check (execute it \u2014 do not read its source):"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```bash"}, {"t": "add", "l": "+CHECK=\"$(ls skills/epic-decompose/*/scripts/check_decomposition.py skills/epic-decompose/scripts/check_decomposition.py 2>/dev/null | head -1)\""}, {"t": "add", "l": "+python3 \"$CHECK\" {ID}"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Any `FINDING` it reports is a concrete artifact defect (the same classes the reviewer checks mechanically) \u2014 fix it as described and re-run until it exits 0. Do not return a summary. Your work is complete when you have run `frontmatter.py set` with `revised=true` (changes made) or `revised=false` (no corrections needed). The pipeline uses this field to detect that the revision agent has finished."}]}, {"file": "epic-decompose/scripts/check_decomposition.py", "rows": [{"t": "hunk", "l": "@@ -0,0 +1,584 @@"}, {"t": "add", "l": "+#!/usr/bin/env python3"}, {"t": "add", "l": "+\"\"\"Mechanical consistency checks for a single strategy's epic decomposition."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Usage:"}, {"t": "add", "l": "+    python3 check_decomposition.py <STRAT_ID> [--root DIR]"}, {"t": "add", "l": "+    python3 check_decomposition.py --self-check"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Run from the pipeline workspace root (or pass --root). Reads:"}, {"t": "add", "l": "+    artifacts/strat-tasks/<ID>.md            (strategy frontmatter)"}, {"t": "add", "l": "+    artifacts/epic-tasks/<ID>-decomposition.md"}, {"t": "add", "l": "+    artifacts/epic-tasks/<ID>-E*.md          (main-plan and -BRANCH-<letter>- epics)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Prints one FINDING block per defect and exits 1; exits 0 when clean."}, {"t": "add", "l": "+Every finding names the file, the defect class, and the concrete fix, so the"}, {"t": "add", "l": "+fix is always actionable: edit the named file as described and re-run."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Checked defect classes (all derived from the review rubric):"}, {"t": "add", "l": "+    docs-priority   docs-authoring epic priority must derive from the strategy"}, {"t": "add", "l": "+                    Jira priority (Critical->P0, Major->P1, else P2)"}, {"t": "add", "l": "+    gating-ac       a rollout gate named in an epic's Scope (feature flag,"}, {"t": "add", "l": "+                    config gate, toggle) must have a matching AC"}, {"t": "add", "l": "+    spec-content    a spec/format epic must not produce real instances of a"}, {"t": "add", "l": "+                    sibling content epic's deliverable (validation stub only)"}, {"t": "add", "l": "+    structure       dependencies resolving to nonexistent epics, branch files"}, {"t": "add", "l": "+                    missing branch/gated_by, main-plan epics depending on"}, {"t": "add", "l": "+                    branch epics, epic_count not matching the files on disk,"}, {"t": "add", "l": "+                    missing per-epic ai-signals rationale files, epic bodies"}, {"t": "add", "l": "+                    referencing sibling epics by draft ID"}, {"t": "add", "l": "+\"\"\""}, {"t": "add", "l": "+"}, {"t": "add", "l": "+import argparse"}, {"t": "add", "l": "+import glob"}, {"t": "add", "l": "+import os"}, {"t": "add", "l": "+import re"}, {"t": "add", "l": "+import sys"}, {"t": "add", "l": "+import tempfile"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# ---------------------------------------------------------------------------"}, {"t": "add", "l": "+# Frontmatter / body parsing (dependency-free; handles the subset of YAML the"}, {"t": "add", "l": "+# pipeline writes: flat keys, dotted keys, one nested dict, dash lists, and"}, {"t": "add", "l": "+# comma-separated or bracketed lists)."}, {"t": "add", "l": "+# ---------------------------------------------------------------------------"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+def parse_frontmatter(text):"}, {"t": "add", "l": "+    \"\"\"Return (fm, body) where fm maps top-level keys to str or [str].\"\"\""}, {"t": "add", "l": "+    fm = {}"}, {"t": "add", "l": "+    body = text"}, {"t": "add", "l": "+    m = re.match(r\"^---\\s*\\n(.*?)\\n---\\s*\\n?(.*)$\", text, re.S)"}, {"t": "add", "l": "+    if not m:"}, {"t": "add", "l": "+        return fm, body"}, {"t": "add", "l": "+    fm_text, body = m.group(1), m.group(2)"}, {"t": "add", "l": "+    current_key = \u00abredacted\u00bb"}, {"t": "add", "l": "+    for line in fm_text.split(\"\\n\"):"}, {"t": "add", "l": "+        if not line.strip() or line.strip().startswith(\"#\"):"}, {"t": "add", "l": "+            continue"}, {"t": "add", "l": "+        stripped = line.strip()"}, {"t": "add", "l": "+        if stripped.startswith(\"- \") and current_key:"}, {"t": "add", "l": "+            # list item under the current key (e.g. dependencies:)"}, {"t": "add", "l": "+            if not isinstance(fm.get(current_key), list):"}, {"t": "add", "l": "+                fm[current_key] = []"}, {"t": "add", "l": "+            item = stripped[2:].strip().strip(\"\\\"'\")"}, {"t": "add", "l": "+            if item:"}, {"t": "add", "l": "+                fm[current_key].append(item)"}, {"t": "add", "l": "+            continue"}, {"t": "add", "l": "+        km = re.match(r\"^([A-Za-z_][\\w]*):\\s*(.*)$\", line)"}, {"t": "add", "l": "+        if km and not line.startswith((\" \", \"\\t\")):"}, {"t": "add", "l": "+            key, val = km.group(1), km.group(2).strip()"}, {"t": "add", "l": "+            current_key = \u00abredacted\u00bb"}, {"t": "add", "l": "+            if val == \"\":"}, {"t": "add", "l": "+                fm[key] = \"\""}, {"t": "add", "l": "+            elif val.startswith(\"[\") and val.endswith(\"]\"):"}, {"t": "add", "l": "+                items = [v.strip().strip(\"\\\"'\") for v in val[1:-1].split(\",\") if v.strip()]"}, {"t": "add", "l": "+                fm[key] = items if items else []"}, {"t": "add", "l": "+                current_key = \u00abredacted\u00bb"}, {"t": "add", "l": "+            else:"}, {"t": "add", "l": "+                fm[key] = val.strip(\"\\\"'\")"}, {"t": "add", "l": "+                current_key = \u00abredacted\u00bb"}, {"t": "add", "l": "+    return fm, body"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+def split_sections(body):"}, {"t": "add", "l": "+    \"\"\"Return {section_title: text} for '## Title' sections.\"\"\""}, {"t": "add", "l": "+    sections = {}"}, {"t": "add", "l": "+    parts = re.split(r\"^## +(.+?)\\s*$\", body, flags=re.M)"}, {"t": "add", "l": "+    for i in range(1, len(parts) - 1, 2):"}, {"t": "add", "l": "+        sections[parts[i].strip()] = parts[i + 1]"}, {"t": "add", "l": "+    return sections"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+def as_list(value):"}, {"t": "add", "l": "+    if value is None:"}, {"t": "add", "l": "+        return []"}, {"t": "add", "l": "+    if isinstance(value, list):"}, {"t": "add", "l": "+        return [v for v in value if v]"}, {"t": "add", "l": "+    if isinstance(value, str):"}, {"t": "add", "l": "+        if value.strip().startswith(\"[\"):"}, {"t": "add", "l": "+            return [v.strip().strip(\"\\\"'\") for v in value.strip()[1:-1].split(\",\") if v.strip()]"}, {"t": "add", "l": "+        return [v.strip().strip(\"\\\"'\") for v in value.split(\",\") if v.strip()]"}, {"t": "add", "l": "+    return []"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# ---------------------------------------------------------------------------"}, {"t": "add", "l": "+# Defect-class lexicons"}, {"t": "add", "l": "+# ---------------------------------------------------------------------------"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+DOCS_PRIORITY_DERIVATION = {\"Critical\": \"P0\", \"Major\": \"P1\"}"}, {"t": "add", "l": "+DOCS_PRIORITY_DEFAULT = \"P2\""}, {"t": "add", "l": "+"}, {"t": "add", "l": "+GATING_TERMS = (\"feature flag\", \"feature-flag\", \"config gate\", \"dashboard config\","}, {"t": "add", "l": "+                \"toggle\", \"gating\")"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+SPEC_WORDS = re.compile(r\"\\b(defin\\w*|specif\\w+|schema|format|standard)\\b\", re.I)"}, {"t": "add", "l": "+PROD_VERBS = re.compile("}, {"t": "add", "l": "+    r\"\\b(produce|produces|produced|author|authors|create|creates|created|\""}, {"t": "add", "l": "+    r\"write|writes|build|builds|develop|develops|deliver|delivers|publish|\""}, {"t": "add", "l": "+    r\"publishes)\\b([^.\\n]{0,90})\", re.I)"}, {"t": "add", "l": "+# A produced-noun window ends at a preposition that introduces purpose/means"}, {"t": "add", "l": "+# (\"create a workbench WITH the tutorial's image\" produces a workbench, not a"}, {"t": "add", "l": "+# tutorial) \u2014 the noun after the preposition is not the thing being produced."}, {"t": "add", "l": "+STOP_PREPS = re.compile(r\"\\b(with|for|from|in|into|using|via|against|onto|to)\\b\", re.I)"}, {"t": "add", "l": "+CONTENT_NOUNS = re.compile(r\"\\b(tutorial|notebook|guide|walkthrough|example|sample|demo)s?\\b\", re.I)"}, {"t": "add", "l": "+AUTHOR_VERBS = re.compile(r\"\\b(author|authors|authored|authoring|write|writes|writing|curate|curates|curated|curating)\\b\", re.I)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+def noun_stems(text):"}, {"t": "add", "l": "+    return {m.group(1).lower().rstrip(\"s\") for m in CONTENT_NOUNS.finditer(text)}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+def produced_content_nouns(text):"}, {"t": "add", "l": "+    \"\"\"Content nouns that some production verb in `text` actually produces.\"\"\""}, {"t": "add", "l": "+    produced = set()"}, {"t": "add", "l": "+    for m in PROD_VERBS.finditer(text):"}, {"t": "add", "l": "+        window = m.group(0)"}, {"t": "add", "l": "+        stop = STOP_PREPS.search(window[len(m.group(1)):])"}, {"t": "add", "l": "+        if stop:"}, {"t": "add", "l": "+            window = window[:len(m.group(1)) + stop.start()]"}, {"t": "add", "l": "+        produced |= noun_stems(window)"}, {"t": "add", "l": "+    return produced"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# ---------------------------------------------------------------------------"}, {"t": "add", "l": "+# Workspace model"}, {"t": "add", "l": "+# ---------------------------------------------------------------------------"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+class Workspace(object):"}, {"t": "add", "l": "+    def __init__(self, root, strat_id):"}, {"t": "add", "l": "+        self.root = root"}, {"t": "add", "l": "+        self.strat_id = strat_id"}, {"t": "add", "l": "+        self.findings = []"}, {"t": "add", "l": "+        self.strategy_fm = {}"}, {"t": "add", "l": "+        self.epics = {}        # epic_id -> dict (main-plan and branch epics)"}, {"t": "add", "l": "+        self.main_ids = []"}, {"t": "add", "l": "+        self.branch_ids = []"}, {"t": "add", "l": "+        self.decomp_fm = {}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+    def path(self, *parts):"}, {"t": "add", "l": "+        return os.path.join(self.root, *parts)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+    def finding(self, cls, file_ref, message):"}, {"t": "add", "l": "+        self.findings.append((cls, file_ref, message))"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+    def load(self):"}, {"t": "add", "l": "+        strat_path = self.path(\"artifacts\", \"strat-tasks\", \"%s.md\" % self.strat_id)"}, {"t": "add", "l": "+        if not os.path.isfile(strat_path):"}, {"t": "add", "l": "+            self.finding(\"missing-input\", strat_path,"}, {"t": "add", "l": "+                         \"strategy file not found \u2014 cannot run consistency checks\")"}, {"t": "add", "l": "+            return False"}, {"t": "add", "l": "+        with open(strat_path) as fh:"}, {"t": "add", "l": "+            self.strategy_fm, _ = parse_frontmatter(fh.read())"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        decomp_path = self.path(\"artifacts\", \"epic-tasks\", \"%s-decomposition.md\" % self.strat_id)"}, {"t": "add", "l": "+        if os.path.isfile(decomp_path):"}, {"t": "add", "l": "+            with open(decomp_path) as fh:"}, {"t": "add", "l": "+                self.decomp_fm, _ = parse_frontmatter(fh.read())"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        pattern = self.path(\"artifacts\", \"epic-tasks\", \"%s-E*.md\" % self.strat_id)"}, {"t": "add", "l": "+        for epic_path in sorted(glob.glob(pattern)):"}, {"t": "add", "l": "+            base = os.path.basename(epic_path)"}, {"t": "add", "l": "+            if base.endswith(\"-ai-signals.md\") or base.endswith(\"-decomposition.md\"):"}, {"t": "add", "l": "+                continue"}, {"t": "add", "l": "+            with open(epic_path) as fh:"}, {"t": "add", "l": "+                fm, body = parse_frontmatter(fh.read())"}, {"t": "add", "l": "+            epic_id = fm.get(\"epic_id\") or base[:-3]"}, {"t": "add", "l": "+            sections = split_sections(body)"}, {"t": "add", "l": "+            epic = {"}, {"t": "add", "l": "+                \"path\": epic_path,"}, {"t": "add", "l": "+                \"base\": base,"}, {"t": "add", "l": "+                \"fm\": fm,"}, {"t": "add", "l": "+                \"body\": body,"}, {"t": "add", "l": "+                \"scope\": sections.get(\"Scope\", \"\"),"}, {"t": "add", "l": "+                \"acs\": sections.get(\"Acceptance Criteria\", \"\"),"}, {"t": "add", "l": "+                \"title\": fm.get(\"title\", \"\"),"}, {"t": "add", "l": "+                \"priority\": fm.get(\"priority\", \"\"),"}, {"t": "add", "l": "+                \"type\": fm.get(\"type\", \"\"),"}, {"t": "add", "l": "+                \"implementation_type\": fm.get(\"implementation_type\") or \"\","}, {"t": "add", "l": "+                \"dependencies\": as_list(fm.get(\"dependencies\")),"}, {"t": "add", "l": "+                \"is_branch\": \"-BRANCH-\" in base,"}, {"t": "add", "l": "+                \"branch\": fm.get(\"branch\") or \"\","}, {"t": "add", "l": "+                \"gated_by\": fm.get(\"gated_by\") or \"\","}, {"t": "add", "l": "+            }"}, {"t": "add", "l": "+            self.epics[epic_id] = epic"}, {"t": "add", "l": "+            (self.branch_ids if epic[\"is_branch\"] else self.main_ids).append(epic_id)"}, {"t": "add", "l": "+        return True"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+    # -- checks --------------------------------------------------------------"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+    def check_docs_priority(self):"}, {"t": "add", "l": "+        strat_priority = (self.strategy_fm.get(\"priority\") or \"\").strip()"}, {"t": "add", "l": "+        expected = DOCS_PRIORITY_DERIVATION.get(strat_priority, DOCS_PRIORITY_DEFAULT)"}, {"t": "add", "l": "+        for eid, epic in sorted(self.epics.items()):"}, {"t": "add", "l": "+            if epic[\"implementation_type\"] != \"docs-authoring\":"}, {"t": "add", "l": "+                continue"}, {"t": "add", "l": "+            if epic[\"priority\"] != expected:"}, {"t": "add", "l": "+                self.finding("}, {"t": "add", "l": "+                    \"docs-priority\", epic[\"base\"],"}, {"t": "add", "l": "+                    \"%s is a docs-authoring epic with priority=%s, but the strategy's \""}, {"t": "add", "l": "+                    \"Jira priority is %r \u2014 the docs-authoring priority exception derives \""}, {"t": "add", "l": "+                    \"Critical->P0, Major->P1, Normal/Minor/missing->P2. Set priority=%s \""}, {"t": "add", "l": "+                    \"(do not copy the HLR's own priority label).\" %"}, {"t": "add", "l": "+                    (eid, epic[\"priority\"] or \"(unset)\", strat_priority or \"(missing)\","}, {"t": "add", "l": "+                     expected))"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+    def check_gating_ac(self):"}, {"t": "add", "l": "+        for eid, epic in sorted(self.epics.items()):"}, {"t": "add", "l": "+            scope_l = epic[\"scope\"].lower()"}, {"t": "add", "l": "+            ac_l = epic[\"acs\"].lower()"}, {"t": "add", "l": "+            named = [t for t in GATING_TERMS if t in scope_l]"}, {"t": "add", "l": "+            if named and not any(t in ac_l for t in GATING_TERMS):"}, {"t": "add", "l": "+                self.finding("}, {"t": "add", "l": "+                    \"gating-ac\", epic[\"base\"],"}, {"t": "add", "l": "+                    \"%s's Scope names a rollout gate (%s) but no acceptance criterion \""}, {"t": "add", "l": "+                    \"verifies the gated behavior. Add an AC that tests the gate (e.g. \""}, {"t": "add", "l": "+                    \"\\\"Given the feature flag is disabled, the surface is not visible; \""}, {"t": "add", "l": "+                    \"given it is enabled, <behavior> holds\\\").\" % (eid, \", \".join(named)))"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+    def check_spec_content_overlap(self):"}, {"t": "add", "l": "+        # Content epics: the TITLE states their work is authoring content"}, {"t": "add", "l": "+        # deliverables (docs-authoring epics are their own work-product class"}, {"t": "add", "l": "+        # and are excluded)."}, {"t": "add", "l": "+        content_nouns_by_epic = {}"}, {"t": "add", "l": "+        for eid, epic in sorted(self.epics.items()):"}, {"t": "add", "l": "+            if epic[\"implementation_type\"] == \"docs-authoring\":"}, {"t": "add", "l": "+                continue"}, {"t": "add", "l": "+            title = epic[\"title\"] or \"\""}, {"t": "add", "l": "+            if AUTHOR_VERBS.search(title):"}, {"t": "add", "l": "+                stems = noun_stems(title)"}, {"t": "add", "l": "+                if stems:"}, {"t": "add", "l": "+                    content_nouns_by_epic[eid] = stems"}, {"t": "add", "l": "+        # Spec epics must not produce real instances of those deliverables."}, {"t": "add", "l": "+        for eid, epic in sorted(self.epics.items()):"}, {"t": "add", "l": "+            if not SPEC_WORDS.search(epic[\"scope\"]):"}, {"t": "add", "l": "+                continue"}, {"t": "add", "l": "+            produced = produced_content_nouns(epic[\"scope\"]) | produced_content_nouns(epic[\"acs\"])"}, {"t": "add", "l": "+            if not produced:"}, {"t": "add", "l": "+                continue"}, {"t": "add", "l": "+            overlaps = {}"}, {"t": "add", "l": "+            for other, stems in sorted(content_nouns_by_epic.items()):"}, {"t": "add", "l": "+                if other == eid:"}, {"t": "add", "l": "+                    continue"}, {"t" e epic decomposition pipeline. Non-interactive."}, {"t": "ctx", "l": " user-invocable: true"}, {"t": "ctx", "l": " allowed-tools: Glob, Bash, Agent"}]}, {"file": "epic-decompose/prompts/decompose-agent.md", "rows": [{"t": "hunk", "l": "@@ -108,4 +108,5 @@"}, {"t": "ctx", "l": "    - **Architectural sub-system boundaries**: backend API vs. frontend plugin, Go service vs. React UI, etc."}, {"t": "ctx", "l": "    - **Work-product type boundaries**: code implementation, content authoring (sample notebooks, tutorials, curated examples), and documentation are different kinds of work \u2014 they require different skills, different review criteria, and produce different PR review cycles. An epic that mixes code implementation with content authoring should be split even if the same team owns both. **Exception \u2014 incidental documentation touch-ups:** updating captions, screenshots, or references that fall out of a code change (no new content authored) is not a separate work stream \u2014 fold it into the originating epic as scope/acceptance criteria rather than a standalone `docs-authoring` epic. Only substantive content/documentation authoring (new tutorials, sample notebooks, curated examples, new or rewritten doc topics), or a strategy with `Documentation Support: Yes`, warrants a separate epic."}, {"t": "add", "l": "+   - **Spec-vs-content boundary**: when one epic defines a format, schema, or standard (a packaging format, metadata schema, API contract, validation spec) and a sibling epic authors the real instances of that format (tutorials, notebooks, curated examples, guides), the format epic must NOT itself author real content instances \u2014 that duplicates the content epic's authoring surface (two teams producing the same deliverable type). Validate the format with a minimal stub: synthetic metadata, a skeleton manifest, placeholder content that exercises the schema. Or explicitly subsume the reference instance into the content epic (\"the first authored instance serves as the reference example\"). Worked example \u2014 an epic *Define the notebook packaging format* whose scope says \"produce a reference example of a correctly packaged notebook\" while a sibling epic *Author the curated notebook library* authors those notebooks: overlap. Correct scope: \"validate the format with a minimal stub notebook fixture (synthetic metadata + placeholder content)\"; the real notebooks are authored by the content epic."}, {"t": "ctx", "l": "    These axes take precedence when deciding where to draw epic boundaries within a component. Step 4 may additionally split by priority when features are genuinely deferrable \u2014 but the initial boundary structure should come from architecture and work-product type, not from walking down the HLR list. Never split such that two epics must build the same data structure, UI surface, or API endpoint independently."}, {"t": "ctx", "l": " "}, {"t": "hunk", "l": "@@ -233,4 +234,5 @@"}, {"t": "ctx", "l": " - Implementation-specific requirements (build pipeline green, rollback plan, doc review, etc.)"}, {"t": "ctx", "l": " - Rules 23-25 from Step 5"}, {"t": "add", "l": "+- **Rollout-gate coverage**: when an epic's scope names a rollout gate (feature flag, config gate, toggle, \"behind a flag\"), at least one AC must verify the gated behavior \u2014 e.g., \"Given the feature flag is disabled, the section is hidden; given the flag is enabled, the section renders and functions.\" A gate named in scope with no verifying AC is an untestable claim. (Human-approval gates and CI gating checks are work items, not rollout gates \u2014 they need no such AC.)"}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " ## Step 8: Generate Artifacts"}, {"t": "hunk", "l": "@@ -330,5 +332,15 @@"}, {"t": "ctx", "l": " Compare the output against the decomposition summary. If any epic file's `dependencies`, `priority`, `type`, or HLR mappings diverged from the plan, fix the epic file to match the summary."}, {"t": "ctx", "l": " "}, {"t": "del", "l": "-Then, as your **final action** \u2014 after every epic file is written and any divergence is fixed \u2014 mark the decomposition complete:"}, {"t": "add", "l": "+Then run the boundary self-check (advisory \u2014 it must never block completion):"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```bash"}, {"t": "add", "l": "+CHECK=skills/epic-decompose/epic-decompose/scripts/check_decomposition.py"}, {"t": "add", "l": "+[ -f \"$CHECK\" ] || CHECK=skills/epic-decompose/scripts/check_decomposition.py"}, {"t": "add", "l": "+if [ -f \"$CHECK\" ]; then python3 \"$CHECK\" \"{ID}\"; else echo \"boundary check unavailable\"; fi"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+If the check prints `FINDING` lines, apply the fix each finding states in the named epic (restate a spec epic's instance-authoring claim as a format-validation stub, or add the missing rollout-gate AC), then re-run it once. If the script is unavailable or errors, note \"boundary check unavailable\" in the decomposition summary's Health Warnings and continue \u2014 do not block completion on the check itself."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Then, as your **final action** \u2014 after every epic file is written, any divergence is fixed, and the boundary check is clean or noted \u2014 mark the decomposition complete:"}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " ```"}]}, {"file": "epic-decompose/prompts/review-agent.md", "rows": [{"t": "hunk", "l": "@@ -65,5 +65,5 @@"}, {"t": "ctx", "l": " - **0**: Epics violate the component/team boundary rule (work for different teams bundled into one epic), or an epic is clearly oversized (multiple sprints of work)."}, {"t": "ctx", "l": " "}, {"t": "del", "l": "-Check: For each epic, verify component and team fields. Look for epics that bundle work across multiple components or teams. **Also check for scope duplication across sibling epics:** compare the scope sections and acceptance criteria of all epics. If two or more epics independently build the same data structure, UI surface, API endpoint, or component (e.g., both create a benchmark list with status indicators, or both implement log viewing against the same endpoint), that is a major issue \u2014 it means the boundary was drawn incorrectly and the epics should be merged or re-split along a different axis. Minor incidental overlap (e.g., both epics mention the same config value) is not duplication. **Also check for work-product type mixing:** if a single epic bundles code implementation with content authoring (sample notebooks, tutorials, curated examples), flag as a major issue \u2014 these are different kinds of work with different review criteria and should be separate epics even when owned by the same team."}, {"t": "add", "l": "+Check: For each epic, verify component and team fields. Look for epics that bundle work across multiple components or teams. **Also check for scope duplication across sibling epics:** compare the scope sections and acceptance criteria of all epics. If two or more epics independently build the same data structure, UI surface, API endpoint, or component (e.g., both create a benchmark list with status indicators, or both implement log viewing against the same endpoint), that is a major issue \u2014 it means the boundary was drawn incorrectly and the epics should be merged or re-split along a different axis. Minor incidental overlap (e.g., both epics mention the same config value) is not duplication. **Also check for work-product type mixing:** if a single epic bundles code implementation with content authoring (sample notebooks, tutorials, curated examples), flag as a major issue \u2014 these are different kinds of work with different review criteria and should be separate epics even when owned by the same team. **Also check for spec-vs-content boundary overlap:** when one epic defines a format, schema, or standard and a sibling epic authors the real instances of that format (tutorials, notebooks, curated examples, guides), the format epic must not itself author real content instances \u2014 a scope or AC promising a \"reference example/tutorial/notebook\" of the deliverable the content epic authors duplicates that epic's authoring surface. Flag it (minor for a single reference instance; major if it materially duplicates the sibling's deliverable); the fix is to restate the claim as a format-validation stub or subsume the reference instance into the content epic \u2014 not to merge the epics. Do NOT flag: docs-authoring epics documenting a format (a sanctioned work product); validation with stubs, fixtures, or synthetic test data; code deliverables that happen to be called \"examples\" (console reports, reference implementations consumed by other code)."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " ### Criterion 4: Type Correctness (0-2 points)"}, {"t": "hunk", "l": "@@ -91,5 +91,5 @@"}, {"t": "ctx", "l": " - **0**: Epics have no ACs, or ACs are vague/untestable across multiple epics, or multiple rule-mandated ACs are missing."}, {"t": "ctx", "l": " "}, {"t": "del", "l": "-Check: Verify each epic has ACs. Check that replacement epics have rollback/feature-flag ACs, docs-authoring has technical review AC, and konflux-chain epics have build pipeline AC. Any missing rule-mandated AC is a major issue \u2014 this applies to every epic that meets the rule's criteria, not just the first or most obvious one. Also check that epic bodies do not reference sibling epics by draft ID (e.g., \"E001\", \"E003\") \u2014 draft IDs are meaningless in Jira. Each reference is a minor issue; 3+ across the decomposition costs a point."}, {"t": "add", "l": "+Check: Verify each epic has ACs. Check that replacement epics have rollback/feature-flag ACs, docs-authoring has technical review AC, and konflux-chain epics have build pipeline AC. Any missing rule-mandated AC is a major issue \u2014 this applies to every epic that meets the rule's criteria, not just the first or most obvious one. **Rollout-gate coverage:** if an epic's scope names a rollout gate (feature flag, config gate, toggle, \"behind a flag\") but no acceptance criterion verifies the gated behavior, list it as an issue (minor) \u2014 the gate claim is untestable as written; the fix is an AC of the form \"gate disabled \u2192 feature hidden/inert; gate enabled \u2192 feature renders and functions.\" Do NOT flag human-approval gates (review boards, sign-offs), CI gating checks, or epics whose ACs already verify the gated behavior in any wording (flag/toggle/enabled/disabled). Also check that epic bodies do not reference sibling epics by draft ID (e.g., \"E001\", \"E003\") \u2014 draft IDs are meaningless in Jira. Each reference is a minor issue; 3+ across the decomposition costs a point."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " ### Criterion 7: Completeness (0-2 points)"}]}, {"file": "epic-decompose/prompts/revise-agent.md", "rows": [{"t": "hunk", "l": "@@ -26,4 +26,6 @@"}, {"t": "ctx", "l": " For each issue in the review's `issues` list, apply the appropriate correction:"}, {"t": "ctx", "l": " "}, {"t": "add", "l": "+Two issue classes are artifact defects with a defined fix \u2014 apply their recipes below even when the reviewer marked them minor: **spec-epic/content-epic overlap** and **missing rollout-gate AC**. Other minors (defensible-choice observations, arguable signal values) keep your judgment latitude."}, {"t": "add", "l": "+"}, {"t": "ctx", "l": " ### HLR Coverage issues"}, {"t": "ctx", "l": " - **Missing HLR mapping**: Find the unmapped HLR in the strategy. Either add it to an existing epic's \"HLR Traceability\" section (if it fits that epic's scope) or create a new epic to cover it."}, {"t": "hunk", "l": "@@ -40,4 +42,5 @@"}, {"t": "ctx", "l": " - **Multi-component/team epic**: Split into separate epics per the component/team tuple rule. Assign new epic IDs continuing the sequence (e.g., if last epic is E007, new ones are E008, E009)."}, {"t": "ctx", "l": " - **Oversized epic**: Split by sub-deliverable into smaller epics."}, {"t": "add", "l": "+- **Spec-epic/content-epic overlap**: a format/schema/standard-defining epic's scope or ACs promise authoring a real content instance (a \"reference example/tutorial/notebook\") that a sibling content-authoring epic also authors. Do NOT merge the epics \u2014 the format/content boundary itself is correct. Restate the spec epic's claim as a format-validation stub (a minimal synthetic fixture that exercises the schema: synthetic metadata, placeholder content), OR subsume the reference instance into the content epic by adding a line to its scope (\"the first authored instance serves as the reference example\") and dropping the claim from the spec epic. Update the affected acceptance criteria to match the chosen shape."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " ### Type Correctness issues"}, {"t": "hunk", "l": "@@ -53,4 +56,5 @@"}, {"t": "ctx", "l": "   - `docs-authoring` epic \u2192 \"technically reviewed against implementation\" AC"}, {"t": "ctx", "l": "   - Epic with `konflux-onboarding` in dependency chain \u2192 \"build pipeline green\" AC"}, {"t": "add", "l": "+  - Epic whose scope names a rollout gate (feature flag, config gate, toggle) \u2192 gate AC: \"Given the gate is disabled, the feature is hidden/inert; given the gate is enabled, the feature renders and functions.\""}, {"t": "ctx", "l": " - **Vague/untestable AC**: Rewrite to be specific and measurable, derived from the strategy's acceptance criteria."}, {"t": "ctx", "l": " "}]}, {"file": "epic-decompose/scripts/check_decomposition.py", "rows": [{"t": "hunk", "l": "@@ -0,0 +1,341 @@"}, {"t": "add", "l": "+#!/usr/bin/env python3"}, {"t": "add", "l": "+\"\"\"Boundary self-check for epic decompositions."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Usage:"}, {"t": "add", "l": "+    python3 check_decomposition.py <STRATEGY_ID> [--epic-dir artifacts/epic-tasks]"}, {"t": "add", "l": "+    python3 check_decomposition.py --self-check"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Two checks, each finding naming the file, the epic, the defect, and the fix:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+  spec-content  A format/schema/standard-defining epic whose Scope or Acceptance"}, {"t": "add", "l": "+                Criteria promise authoring a real content instance (a \"reference"}, {"t": "add", "l": "+                \u00abredacted\u00bb\") while a"}, {"t": "add", "l": "+                sibling epic authors that same content type. Two teams then"}, {"t": "add", "l": "+                author the same deliverable \u2014 a boundary overlap."}, {"t": "add", "l": "+                Fix: restate the claim as a format-validation stub (minimal"}, {"t": "add", "l": "+                synthetic fixture) or subsume the reference instance into the"}, {"t": "add", "l": "+                content epic. Never merge the two epics."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+  gating-ac     An epic whose Scope names a rollout gate (feature flag, config"}, {"t": "add", "l": "+                gate, toggle, \"behind a flag\") but whose Acceptance Criteria do"}, {"t": "add", "l": "+                not verify the gated behavior. A gate named in scope with no"}, {"t": "add", "l": "+                verifying AC is an untestable claim."}, {"t": "add", "l": "+                Fix: add an AC (gate disabled -> feature hidden/inert;"}, {"t": "add", "l": "+                gate enabled -> feature renders and functions)."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Excluded by design (verified non-defect classes):"}, {"t": "add", "l": "+  - docs-authoring epics (documenting a format is a sanctioned work product);"}, {"t": "add", "l": "+  - human-approval gates, review boards, sign-offs, and CI gating checks"}, {"t": "add", "l": "+    (work items, not rollout gates of the feature being built)."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Exit codes: 0 = no findings, 1 = findings, 2 = usage error."}, {"t": "add", "l": "+The check is advisory and fail-open: fix findings when printed, but never block"}, {"t": "add", "l": "+decomposition completion on a script error."}, {"t": "add", "l": "+\"\"\""}, {"t": "add", "l": "+"}, {"t": "add", "l": "+import glob"}, {"t": "add", "l": "+import os"}, {"t": "add", "l": "+import re"}, {"t": "add", "l": "+import sys"}, {"t": "add", "l": "+import tempfile"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# A real-instance authoring claim inside a format/spec epic (\"reference ...\")."}, {"t": "add", "l": "+REF_CLAIM = re.compile("}, {"t": "add", "l": "+    r\"reference\\s+(example|tutorial|notebook|sample|guide|walkthrough|\""}, {"t": "add", "l": "+    r\"implementation|instance)\","}, {"t": "add", "l": "+    re.IGNORECASE,"}, {"t": "add", "l": "+)"}, {"t": "add", "l": "+# A content-authoring claim in a sibling epic (verb + content noun, one line)."}, {"t": "add", "l": "+AUTHOR_CLAIM = re.compile("}, {"t": "add", "l": "+    r\"(author|curat|writ|creat|produc|publish)\\w*[^.\\n]{0,80}\""}, {"t": "add", "l": "+    r\"(tutorial|notebook|sample notebook|curated example|walkthrough|guide)\","}, {"t": "add", "l": "+    re.IGNORECASE,"}, {"t": "add", "l": "+)"}, {"t": "add", "l": "+# Rollout-gate vocabulary in a Scope section."}, {"t": "add", "l": "+GATE_SCOPE = re.compile("}, {"t": "add", "l": "+    r\"feature[ -]?flag|config\\s+gat|dashboard\\s+config|toggle|behind a flag|\""}, {"t": "add", "l": "+    r\"flag-gated|gating for\","}, {"t": "add", "l": "+    re.IGNORECASE,"}, {"t": "add", "l": "+)"}, {"t": "add", "l": "+# Gate-verification vocabulary anywhere in the Acceptance Criteria section."}, {"t": "add", "l": "+GATE_AC = re.compile(r\"flag|gat(e|ing)|toggl|enabl|disabl\", re.IGNORECASE)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+CONTENT_NOUNS = ("}, {"t": "add", "l": "+    \"tutorial\", \"notebook\", \"example\", \"sample\", \"guide\", \"walkthrough\","}, {"t": "add", "l": "+    \"instance\", \"implementation\","}, {"t": "add", "l": "+)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+def singular(noun):"}, {"t": "add", "l": "+    noun = noun.lower()"}, {"t": "add", "l": "+    return noun[:-1] if noun.endswith(\"s\") else noun"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+def claim_noun(text, pos):"}, {"t": "add", "l": "+    \"\"\"Return the content noun nearest after position pos in text, if any.\"\"\""}, {"t": "add", "l": "+    tail = text[pos:pos + 200].lower()"}, {"t": "add", "l": "+    for noun in CONTENT_NOUNS:"}, {"t": "add", "l": "+        idx = tail.find(noun)"}, {"t": "add", "l": "+        if idx != -1:"}, {"t": "add", "l": "+            return singular(noun)"}, {"t": "add", "l": "+    return None"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+class Epic:"}, {"t": "add", "l": "+    def __init__(self, path):"}, {"t": "add", "l": "+        self.path = path"}, {"t": "add", "l": "+        text = open(path, encoding=\"utf-8\").read()"}, {"t": "add", "l": "+        parts = text.split(\"---\")"}, {"t": "add", "l": "+        self.frontmatter = parts[1] if len(parts) >= 3 else \"\""}, {"t": "add", "l": "+        self.body = \"---\".join(parts[2:]) if len(parts) >= 3 else text"}, {"t": "add", "l": "+        self.epic_id = self._fm(\"epic_id\") or os.path.basename(path)"}, {"t": "add", "l": "+        self.title = self._fm(\"title\") or \"\""}, {"t": "add", "l": "+        self.implementation_type = self._fm(\"implementation_type\")"}, {"t": "add", "l": "+        self.scope = self._section(\"Scope\")"}, {"t": "add", "l": "+        self.acs = self._section(\"Acceptance Criteria\")"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+    def _fm(self, key):"}, {"t": "add", "l": "+        m = re.search(r\"^%s:\\s*(.+?)\\s*$\" % re.escape(key), self.frontmatter,"}, {"t": "add", "l": "+                      re.MULTILINE)"}, {"t": "add", "l": "+        return m.group(1) if m else None"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+    def _section(self, name):"}, {"t": "add", "l": "+        m = re.search(r\"## %s\\n(.*?)(?=\\n## |\\Z)\" % re.escape(name), self.body,"}, {"t": "add", "l": "+                      re.DOTALL)"}, {"t": "add", "l": "+        return m.group(1) if m else \"\""}, {"t": "add", "l": "+"}, {"t": "add", "l": "+    @property"}, {"t": "add", "l": "+    def is_docs(self):"}, {"t": "add", "l": "+        return self.implementation_type == \"docs-authoring\""}, {"t": "add", "l": "+"}, {"t": "add", "l": "+    @property"}, {"t": "add", "l": "+    def scan_text(self):"}, {"t": "add", "l": "+        return self.scope + \"\\n\" + self.acs"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+def load_epics(strategy_id, epic_dir):"}, {"t": "add", "l": "+    paths = []"}, {"t": "add", "l": "+    for pattern in (\"%s-E*.md\" % strategy_id,):"}, {"t": "add", "l": "+        paths.extend(glob.glob(os.path.join(epic_dir, pattern)))"}, {"t": "add", "l": "+    paths = [p for p in sorted(set(paths))"}, {"t": "add", "l": "+             if not p.endswith(\"-ai-signals.md\")]"}, {"t": "add", "l": "+    return [Epic(p) for p in paths]"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+def check_spec_content(epics):"}, {"t": "add", "l": "+    \"\"\"Flag non-docs epics that claim to author a real content instance which"}, {"t": "add", "l": "+    a sibling non-docs epic also authors (format/content boundary overlap).\"\"\""}, {"t": "add", "l": "+    findings = []"}, {"t": "add", "l": "+    candidates = [e for e in epics if not e.is_docs]"}, {"t": "add", "l": "+    for a in candidates:"}, {"t": "add", "l": "+        claim = REF_CLAIM.search(a.scan_text)"}, {"t": "add", "l": "+        if not claim:"}, {"t": "add", "l": "+            continue"}, {"t": "add", "l": "+        noun_a = claim_noun(a.scan_text, claim.end()) or singular("}, {"t": "add", "l": "+            claim.group(1))"}, {"t": "add", "l": "+        # Prefer a sibling whose title carries the authoring claim."}, {"t": "add", "l": "+        partner = None"}, {"t": "add", "l": "+        for prefer_title in (True, False):"}, {"t": "add", "l": "+            for b in candidates:"}, {"t": "add", "l": "+                if b.epic_id == a.epic_id:"}, {"t": "add", "l": "+                    continue"}, {"t": "add", "l": "+                hay = b.title if prefer_title else (b.title + \"\\n\" + b.scope)"}, {"t": "add", "l": "+                m = AUTHOR_CLAIM.search(hay)"}, {"t": "add", "l": "+                if m:"}, {"t": "add", "l": "+                    noun_b = singular(m.group(2).split()[-1])"}, {"t": "add", "l": "+                    if noun_a == noun_b or noun_a.startswith(noun_b) or \\"}, {"t": "add", "l": "+                            noun_b.startswith(noun_a):"}, {"t": "add", "l": "+                        partner = (b, m.group(0))"}, {"t": "add", "l": "+                        break"}, {"t": "add", "l": "+            if partner:"}, {"t": "add", "l": "+                break"}, {"t": "add", "l": "+        if partner:"}, {"t": "add", "l": "+            b, phrase = partner"}, {"t": "add", "l": "+            findings.append("}, {"t": "add", "l": "+                \"FINDING [spec-content] %s (%s): authors a real content \""}, {"t": "add", "l": "+                \"instance (\\\"%s\\\") that %s also authors (\\\"%s\\\"). Fix: \""}, {"t": "add", "l": "+                \"restate as a format-validation stub (minimal synthetic \""}, {"t": "add", "l": "+                \"fixture exercising the schema) or subsume the reference \""}, {"t": "add", "l": "+                \"instance into the content epic \u2014 do NOT merge the epics.\""}, {"t": "add", "l": "+                % (a.epic_id, os.path.basename(a.path), claim.group(0),"}, {"t": "add", "l": "+                   b.epic_id, phrase))"}, {"t": "add", "l": "+    return findings"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+def check_gating_ac(epics):"}, {"t": "add", "l": "+    \"\"\"Flag non-docs epics naming a rollo ly enough to prove the format checks mechanically \u2014 and states explicitly that the stub is validation scaffolding, not a usable deliverable. The real instances are authored in the content epics as packaged users of the format. (Example: a \"define the benchmark result-file schema\" epic may include a tiny synthetic result file that passes schema validation; it must not author a real benchmark suite \u2014 that is the content epic's work product. Two epics authoring the same work product is a boundary overlap even when one calls it a \"reference example\".)"}, {"t": "ctx", "l": "    These axes take precedence when deciding where to draw epic boundaries within a component. Step 4 may additionally split by priority when features are genuinely deferrable \u2014 but the initial boundary structure should come from architecture and work-product type, not from walking down the HLR list. Never split such that two epics must build the same data structure, UI surface, or API endpoint independently."}, {"t": "ctx", "l": " "}, {"t": "hunk", "l": "@@ -233,4 +234,9 @@"}, {"t": "ctx", "l": " - Implementation-specific requirements (build pipeline green, rollback plan, doc review, etc.)"}, {"t": "ctx", "l": " - Rules 23-25 from Step 5"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Two consistency rules that close recurring AC gaps:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- **Parallel-supplier AC completeness**: when an epic's acceptance criteria verify against an artifact that a *parallel* epic (no DAG edge between them) supplies \u2014 e.g. a spec epic's validation fixtures, a contract epic's example payloads \u2014 the supplying epic's own ACs must explicitly guarantee that artifact for **every kind or case the verifying epic's ACs enumerate**. Otherwise the verification silently depends on work the DAG does not order. (Example: if a CLI epic's AC requires \"the import command works against one JSON example and one YAML example\" while the config-schema epic runs in parallel, the schema epic's AC must state that its validation fixtures include one conformant example of *each* format.)"}, {"t": "add", "l": "+- **Rollout-gate AC coverage**: when an epic's own scope introduces a feature-rollout mechanism \u2014 a feature flag, a config-gated section, a staged rollout switch \u2014 at least one acceptance criterion must verify the gated behavior (that the feature works with the gate on, and the pre-gate state is preserved with it off). This does **not** apply to: human approval processes that are the strategy's subject matter (review boards, sign-offs, external submissions), CI gating that is itself the epic's deliverable, or entitlement/enablement gating that other ACs already verify."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " ## Step 8: Generate Artifacts"}, {"t": "hunk", "l": "@@ -330,4 +336,14 @@"}, {"t": "ctx", "l": " Compare the output against the decomposition summary. If any epic file's `dependencies`, `priority`, `type`, or HLR mappings diverged from the plan, fix the epic file to match the summary."}, {"t": "ctx", "l": " "}, {"t": "add", "l": "+Then run the structural consistency check (execute it \u2014 do not read or rewrite it):"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```bash"}, {"t": "add", "l": "+CHECK=skills/epic-decompose/epic-decompose/scripts/check_decomposition.py"}, {"t": "add", "l": "+[ -f \"$CHECK\" ] || CHECK=skills/epic-decompose/scripts/check_decomposition.py"}, {"t": "add", "l": "+if [ -f \"$CHECK\" ]; then python3 \"$CHECK\" \"{ID}\"; else echo \"consistency check unavailable\"; fi"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+It compares the summary's Mermaid DAG against every epic's frontmatter `dependencies` (both directions) and checks for dangling or cyclic dependencies. If it prints `FINDING` lines, apply the fix each finding states (usually adding a missing arrow to the Mermaid diagram or a missing entry to a `dependencies` list) and re-run it once. If findings persist after one fix pass, leave them \u2014 the adversarial review will catch them. Do not mention this check in the decomposition summary; it is routine verification, not a finding."}, {"t": "add", "l": "+"}, {"t": "ctx", "l": " Then, as your **final action** \u2014 after every epic file is written and any divergence is fixed \u2014 mark the decomposition complete:"}, {"t": "ctx", "l": " "}]}, {"file": "epic-decompose/prompts/review-agent.md", "rows": [{"t": "hunk", "l": "@@ -99,5 +99,5 @@"}, {"t": "ctx", "l": " - **0**: Strategy scope is missing from the epic set (a primary capability or P0/P1 acceptance criterion has no corresponding epic), or conditional branches don't cover stated outcomes, or strategy-level context (risks, open questions) is silently dropped across multiple epics."}, {"t": "ctx", "l": " "}, {"t": "del", "l": "-Check: Compare the strategy's scope, acceptance criteria, and capabilities against the combined epic set. Look for gaps. Also check cross-epic consistency: when an upstream epic's scope covers multiple items (modules, components, APIs), verify that the downstream epic set collectively accounts for all of them \u2014 not silently dropped. Verify that strategy-level context relevant to an epic's scope (risks, assumptions, open questions, stakeholder commitments, etc.) is carried forward \u2014 not silently dropped. **Docs-authoring check**: if the strategy's Prerequisites & Process Gates section lists `Documentation Support: Yes`, the epic set must include a `docs-authoring` epic (Rule 11). A missing docs-authoring epic when documentation support is required is a major issue \u2014 score 0."}, {"t": "add", "l": "+Check: Compare the strategy's scope, acceptance criteria, and capabilities against the combined epic set. Look for gaps. Also check cross-epic consistency: when an upstream epic's scope covers multiple items (modules, components, APIs), verify that the downstream epic set collectively accounts for all of them \u2014 not silently dropped. Verify that strategy-level context relevant to an epic's scope (risks, assumptions, open questions, stakeholder commitments, etc.) is carried forward \u2014 not silently dropped. **Docs-authoring check**: if the strategy's Prerequisites & Process Gates section lists `Documentation Support: Yes`, the epic set must include a `docs-authoring` epic (Rule 11). A missing docs-authoring epic when documentation support is required is a major issue \u2014 score 0. **Already-surfaced strategy ambiguity is not a completeness issue**: when the decomposition summary's Health Warnings section already surfaces a strategy-level ambiguity or missing input (ambiguous scope, a missing Impacted Teams / Dependencies / Acceptance Criteria section, a component with no architecture-context file), the decomposition has met its obligation for that input \u2014 explicit surfacing is the correct handling, and the epic set following the strategy's *declared* scope is correct behavior. Do not re-list such an item as an unresolved Completeness issue; at most record it as an observation noting the health warning already covers it. A real completeness issue is scope from the strategy's declared requirements that no epic covers \u2014 not a question only the strategy author can answer (\"confirm with the strategy author\" items are strategy questions, not decomposition defects)."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " ## Step 3: Score and Decide"}]}, {"file": "epic-decompose/prompts/revise-agent.md", "rows": [{"t": "hunk", "l": "@@ -22,4 +22,6 @@"}, {"t": "ctx", "l": " **Only fix issues the reviewer identified.** If a criterion scored full points, don't touch it. Never rewrite the entire decomposition from scratch."}, {"t": "ctx", "l": " "}, {"t": "add", "l": "+**Defect minors are not optional.** A `minor` issue whose description prescribes a concrete change to an artifact \u2014 an overlap or duplicated work product to remove, a missing acceptance criterion for a named scope item or a missing rule-mandated AC, a structural inconsistency to reconcile (frontmatter dependencies vs the summary's DAG diagram, an epic vs the summary's Epic List), a priority field that should follow its mandated derivation \u2014 is a defect: fix it even though it is only `minor`. A `minor` that expresses a judgment call stays at your discretion: the reviewer hedges it as defensible or arguable, frames the change as conditional (\"if X is wanted, it should be\u2026\"), asks a human to confirm strategy intent, or compares sibling epics' signal values or bundling trade-offs \u2014 those are observations, not defects, and observation-minors may legitimately remain."}, {"t": "add", "l": "+"}, {"t": "ctx", "l": " If the review passed all criteria with no issues to fix, skip to Step 3."}, {"t": "ctx", "l": " "}, {"t": "hunk", "l": "@@ -38,4 +40,5 @@"}, {"t": "ctx", "l": " - **Triage inconsistency** (`triage: below-threshold` or `docs-only` with `epic_count > 1`): The decomposer applied multi-epic logic after triage should have stopped the flow. Merge all epics back into a single epic `{ID}-E001.md`. Combine the scope, acceptance criteria, and HLR traceability from all existing epics into the single file. Delete the extra epic files and their AI signal files. Update the decomposition summary to reflect `epic_count: 1` and `critical_path_length: 1`."}, {"t": "ctx", "l": " - **Scope duplication across sibling epics**: Two or more epics independently build the same data structure, UI surface, or API endpoint. Merge the overlapping epics into one, or re-split along an architectural sub-system boundary (e.g., backend vs. frontend) instead of the current axis. Deduplicate acceptance criteria and scope. Delete any epic files that were merged away and update the decomposition summary."}, {"t": "add", "l": "+- **Spec-epic/content-epic overlap** (a format/schema/standard-defining epic that also authors real content instances \u2014 e.g., a \"reference example\" of a correctly packaged item \u2014 duplicating a content epic's authoring surface): **stub or subsume, never merge.** Either (a) restate the spec epic's instance-authoring scope as a minimal validation stub \u2014 synthetic metadata, placeholder content, explicitly not a usable deliverable \u2014 and adjust its ACs to match, or (b) move the instance authoring into the content epic that owns that work product. Merging the two epics is wrong: spec-defining and content-authoring are different work products with different review criteria. When you convert a scope to a stub, check every parallel epic whose ACs verify against the stub \u2014 the stub's ACs must supply what those ACs enumerate (one conformant fixture per kind they verify against)."}, {"t": "ctx", "l": " - **Multi-component/team epic**: Split into separate epics per the component/team tuple rule. Assign new epic IDs continuing the sequence (e.g., if last epic is E007, new ones are E008, E009)."}, {"t": "ctx", "l": " - **Oversized epic**: Split by sub-deliverable into smaller epics."}, {"t": "hunk", "l": "@@ -53,4 +56,5 @@"}, {"t": "ctx", "l": "   - `docs-authoring` epic \u2192 \"technically reviewed against implementation\" AC"}, {"t": "ctx", "l": "   - Epic with `konflux-onboarding` in dependency chain \u2192 \"build pipeline green\" AC"}, {"t": "add", "l": "+- **Missing rollout-gate AC** (an epic's own scope introduces a feature flag or config-gated rollout, but no AC verifies the gated behavior): add a gate-verification AC of the form \"given the gate is on, the capability works as specified; given the gate is off, the previous behavior is preserved\". This is distinct from CI gating that is the epic's deliverable or human approval processes that are the strategy's subject matter \u2014 those are not rollout gates."}, {"t": "ctx", "l": " - **Vague/untestable AC**: Rewrite to be specific and measurable, derived from the strategy's acceptance criteria."}, {"t": "ctx", "l": " "}, {"t": "hunk", "l": "@@ -89,3 +93,15 @@"}, {"t": "ctx", "l": " - `epic_count` in the summary matches the actual number of epic files"}, {"t": "ctx", "l": " "}, {"t": "add", "l": "+**Propagate dependency and AC changes fully.** If your corrections added, removed, or changed any epic's `dependencies`, update BOTH the Mermaid DAG diagram in the summary AND the DAG Justification table to match \u2014 a frontmatter change the diagram doesn't reflect is itself a reviewable inconsistency. If your corrections changed a producer epic's scope or ACs (e.g., converting instance-authoring to a validation stub), re-read every parallel epic whose ACs verify against that producer's artifacts and confirm those ACs still name something the producer's ACs actually guarantee; extend the producer's ACs if they don't."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Then run the structural consistency check (execute it \u2014 do not read or rewrite it):"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```bash"}, {"t": "add", "l": "+CHECK=skills/epic-decompose/epic-decompose/scripts/check_decomposition.py"}, {"t": "add", "l": "+[ -f \"$CHECK\" ] || CHECK=skills/epic-decompose/scripts/check_decomposition.py"}, {"t": "add", "l": "+if [ -f \"$CHECK\" ]; then python3 \"$CHECK\" \"{ID}\"; else echo \"consistency check unavailable\"; fi"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+If it prints `FINDING` lines, apply the fix each finding states (usually a missing Mermaid arrow or a stale `dependencies` entry) and re-run it once. If it prints `OK` or is unavailable, proceed \u2014 it never blocks your completion."}, {"t": "add", "l": "+"}, {"t": "ctx", "l": " Do not return a summary. Your work is complete when you have run `frontmatter.py set` with `revised=true` (changes made) or `revised=false` (no corrections needed). The pipeline uses this field to detect that the revision agent has finished."}]}, {"file": "epic-decompose/scripts/check_decomposition.py", "rows": [{"t": "hunk", "l": "@@ -0,0 +1,324 @@"}, {"t": "add", "l": "+#!/usr/bin/env python3"}, {"t": "add", "l": "+\"\"\"Structural consistency self-check for epic decompositions."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Usage:"}, {"t": "add", "l": "+    python3 check_decomposition.py <STRATEGY_ID> [--epic-dir artifacts/epic-tasks]"}, {"t": "add", "l": "+    python3 check_decomposition.py --self-check"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Checks (structural invariants only \u2014 no semantic judgment, so a finding is"}, {"t": "add", "l": "+always a real inconsistency the downstream review rubric scores as critical):"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+  mermaid-frontmatter   Every dependency edge in the decomposition summary's"}, {"t": "add", "l": "+                        Mermaid DAG has a matching entry in the dependent"}, {"t": "add", "l": "+                        epic's frontmatter `dependencies`, and every"}, {"t": "add", "l": "+                        frontmatter dependency of a main-plan epic appears as"}, {"t": "add", "l": "+                        an edge in the diagram (both directions)."}, {"t": "add", "l": "+  dangling-dependency   An epic's `dependencies` references an epic_id that"}, {"t": "add", "l": "+                        has no file on disk."}, {"t": "add", "l": "+  main-plan-branch-dep  A main-plan epic lists a `-BRANCH-<letter>-` epic in"}, {"t": "add", "l": "+                        its `dependencies` (branch epics are never created as"}, {"t": "add", "l": "+                        issues; depending on one dangles)."}, {"t": "add", "l": "+  dependency-cycle      The frontmatter dependency graph has a cycle."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Each finding names the file, the defect, and the exact fix. Exit 0 with"}, {"t": "add", "l": "+\"OK: ...\" when there are no findings; exit 1 with FINDING lines otherwise."}, {"t": "add", "l": "+Exit 2 on usage/parse trouble BEFORE any artifacts were read (callers treat"}, {"t": "add", "l": "+non-zero-with-no-FINDING-lines as
